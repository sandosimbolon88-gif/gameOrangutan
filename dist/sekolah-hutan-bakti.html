/* Pelajaran 4 · Membuat sarang: pilih tempat yang tinggi dan kuat, anyam dahan, alasi daun, sebelum gelap. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG, UI = S.UI;
  const L = (S.Lessons = S.Lessons || {});
  const F = { x: 820, y: 378 };                // percabangan pohon (tempat sarang)
  const SPOTS = [
    { id: 'low', x: 330, y: 770 },
    { id: 'dead', x: 1296, y: 432 },
    { id: 'good', x: F.x, y: F.y - 6 }
  ];
  const WEAVE_ANG = [-172, -140, -112, -68, -40, -8];
  const BED = [{ x: 600, y: 300 }, { x: 1040, y: 292 }, { x: 700, y: 170 }, { x: 950, y: 150 }, { x: 520, y: 200 }];
  const D2R = Math.PI / 180;

  function drawFar(ctx, w, h) {
    A.farForest(ctx, w, h, [
      { y: 520, r: 80, col: 'rgba(40,70,72,.75)' },
      { y: 610, r: 95, col: '#263f40', trunks: 8, trunkCol: '#223738' }
    ], 121);
  }
  function drawFore(ctx, w, h) {
    ctx.fillStyle = '#1f3a24'; ctx.fillRect(0, 820, w, h - 820);
    A.grass(ctx, 0, w, 830, 34, '#2a4f2c', 7);
    // semak rendah
    A.drawFoliage(ctx, 300, 800, 110, 122, ['#1f4a2a', '#2e6337', '#3f7a42', '#5c9450']);
    A.drawFoliage(ctx, 400, 820, 80, 123, ['#1f4a2a', '#2e6337', '#3f7a42', '#5c9450']);
    // pohon mati
    A.drawTrunk(ctx, 1300, 430, 900, 70, { seed: 41, col: '#8c8378', dark: '#5e574e', hi: '#a9a094' });
    ctx.strokeStyle = '#2b1a0e'; ctx.lineCap = 'round';
    for (const [x1, y1, x2, y2, wd] of [[1290, 450, 1200, 330, 16], [1310, 450, 1400, 320, 14], [1210, 345, 1170, 280, 8], [1390, 335, 1440, 290, 7]]) {
      ctx.lineWidth = wd + 5; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = '#8c8378'; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = '#2b1a0e';
    }
    // pohon utama yang hidup
    A.drawFoliage(ctx, 600, 190, 160, 124, ['#1f5233', '#2f7040', '#43884a', '#62a356']);
    A.drawFoliage(ctx, 1040, 180, 160, 125, ['#1f5233', '#2f7040', '#43884a', '#62a356']);
    A.drawTrunk(ctx, F.x, F.y - 10, 905, 112, { buttress: true, seed: 42 });
    ctx.lineCap = 'round';
    for (const [x2, y2, wd] of [[660, 210, 40], [990, 200, 38]]) {
      ctx.strokeStyle = '#2b1a0e'; ctx.lineWidth = wd + 6; ctx.beginPath(); ctx.moveTo(F.x, F.y + 10); ctx.quadraticCurveTo((F.x + x2) / 2, F.y - 40, x2, y2); ctx.stroke();
      ctx.strokeStyle = '#6b4a33'; ctx.lineWidth = wd; ctx.beginPath(); ctx.moveTo(F.x, F.y + 10); ctx.quadraticCurveTo((F.x + x2) / 2, F.y - 40, x2, y2); ctx.stroke();
    }
    A.drawFoliage(ctx, 820, 110, 210, 126, ['#1f5233', '#2f7040', '#43884a', '#62a356']);
  }

  class Nest {
    constructor(g, o) {
      this.g = g; this.def = o.def; this.rng = S.rng(o.seed); this.t = 0;
      this.scale = 1.05 * o.s;
      this.phase = 'choose'; this.wrongSpots = new Set();
      this.woven = 0; this.bed = 0; this.weaveOrder = S.rng(o.seed).shuffle([0, 1, 2, 3, 4, 5]);
      this.bendAnim = null; this.bedFly = []; this.bedTaken = new Set();
      this.pos = { x: 676, y: 868 - 26 * this.scale }; this.climb = null; this.sleeping = false;
      this.far = A.layer('nest-far', drawFar);
      this.fore = A.layer('nest-fore', drawFore);
      this.stars = [];
      for (let i = 0; i < 60; i++) this.stars.push({ x: this.rng() * 1600, y: this.rng() * 420, r: 1 + this.rng() * 2, ph: this.rng() * 6 });
      this.flies = [];
      for (let i = 0; i < 14; i++) this.flies.push({ x: this.rng() * 1600, y: 500 + this.rng() * 360, ph: this.rng() * 6 });
    }
    get total() { return 1 + CFG.nest.weave + CFG.nest.bed; }
    count() { return (this.phase === 'choose' ? 0 : 1) + this.woven + this.bed; }
    objective() {
      const n = this.count(), ph = C.nestPhase[this.phase] || '';
      return { text: S.tpl(this.def.objective, { n, m: this.total }) + (ph ? ' · ' + ph : ''), frac: n / this.total };
    }
    get done() { return this.sleeping; }
    get finishDelay() { return 2.2; }
    progress() { return S.clamp(this.t / Math.max(10, this.g.duration), 0, 1); }

    update(dt) {
      this.t += dt;
      if (this.climb) { this.climb.p += dt / this.climb.dur; if (this.climb.p >= 1) { this.pos = this.climb.to; this.climb = null; this.phase = 'weave'; } }
      if (this.bendAnim) { this.bendAnim.p += dt / 0.45; if (this.bendAnim.p >= 1) { this.bendAnim = null; this.woven++; if (this.woven >= CFG.nest.weave) this.phase = 'bed'; } }
      for (const b of this.bedFly) b.p += dt / 0.5;
      const landed = this.bedFly.filter((b) => b.p >= 1).length;
      if (landed) { this.bed += landed; this.bedFly = this.bedFly.filter((b) => b.p < 1); S.Audio.rustle(); }
      if (this.phase === 'bed' && this.bed >= CFG.nest.bed && !this.bedFly.length) { this.phase = 'sleep'; this.sleeping = true; }
    }
    onTimeUp() { if (!this.sleeping) UI.bubble(F.x, F.y - 40, C.nestPhase.sleep, C.nestDark); this.forcedSleep = true; }

    weaveGeom(i, bend) {
      const a = WEAVE_ANG[i] * D2R, c = Math.cos(a), s = Math.sin(a);
      const x0 = F.x + c * 70, y0 = F.y - 6 + s * 40;
      const tx = F.x + c * 230, ty = F.y - 6 + s * 170, rx = F.x - c * 60, ry = F.y - 4;
      return { x0, y0, x1: S.lerp(tx, rx, bend), y1: S.lerp(ty, ry, bend) };

    pointer(x, y, tol) {
      if (this.climb || this.sleeping) return true;
      if (this.phase === 'choose') {
        for (const sp of SPOTS) {
          if (this.wrongSpots.has(sp.id) || S.dist(x, y, sp.x, sp.y) > 80 + tol) continue;
          if (sp.id === 'good') {
            this.phase = 'climbing';
            this.climb = { from: { x: this.pos.x, y: this.pos.y }, to: { x: F.x, y: F.y - 4 }, p: 0, dur: 1.2 };
            this.g.good(CFG.goodPoints, sp.x, sp.y, C.nestSpots.good);
            S.Audio.whoosh();
          } else {
            this.wrongSpots.add(sp.id);
            const t = C.nestSpots[sp.id];
            this.g.bad(CFG.badPenalty, sp.x, sp.y, t.title, t.text);
          }
          return true;
        }
        return false;
      }
      if (this.phase === 'weave') {
        if (this.bendAnim) return true;
        const want = this.weaveOrder[this.woven];
        for (let i = 0; i < 6; i++) {
          if (this.weaveOrder.indexOf(i) < this.woven) continue;
          const gm = this.weaveGeom(i, 0);
          if (S.segDist(x, y, gm.x0, gm.y0, gm.x1, gm.y1) > 42 + tol) continue;
          if (i === want) {
            this.bendAnim = { i, p: 0 };
            S.Audio.rustle();
            this.g.good(5, gm.x1, gm.y1);
          } else {
            this.g.bad(CFG.smallPenalty, gm.x1, gm.y1, C.nestWrong, '');
          }
          return true;
        }
        return false;
      }
      if (this.phase === 'bed') {
        for (let i = 0; i < BED.length; i++) {
          if (this.bedTaken.has(i)) continue;
          const b = BED[i];
          if (S.dist(x, y, b.x, b.y) > 62 + tol) continue;
          this.bedTaken.add(i);
          this.bedFly.push({ sx: b.x, sy: b.y, p: 0 });
          this.g.good(5, b.x, b.y);
          return true;
        }
        return false;
      }
      return false;
    }

    renderSky(ctx, now) {
      const k = this.progress();
      const top = k < 0.5 ? S.mixColor('#f4a96a', '#6a4f8f', k * 2) : S.mixColor('#6a4f8f', '#141c3c', (k - 0.5) * 2);
      const bot = k < 0.5 ? S.mixColor('#ffd59a', '#e2806a', k * 2) : S.mixColor('#e2806a', '#2c3463', (k - 0.5) * 2);
      const g = ctx.createLinearGradient(0, 0, 0, 640);
      g.addColorStop(0, top); g.addColorStop(1, bot);
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.VW, S.VH);
      const sy = 260 + k * 420;
      const sg = ctx.createRadialGradient(1240, sy, 10, 1240, sy, 120);
      sg.addColorStop(0, 'rgba(255,236,170,.95)'); sg.addColorStop(0.35, 'rgba(255,200,120,.6)'); sg.addColorStop(1, 'rgba(255,180,100,0)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(1240, sy, 120, 0, S.TAU); ctx.fill();
      if (k > 0.55 || this.sleeping) {
        const a = this.sleeping ? 1 : (k - 0.55) / 0.45;
        for (const s of this.stars) { ctx.globalAlpha = a * (0.5 + 0.5 * Math.sin(now * 2 + s.ph)); ctx.fillStyle = '#fff8d8'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, S.TAU); ctx.fill(); }
        ctx.globalAlpha = 1;
      }
    }

    render(ctx, now) {
      this.renderSky(ctx, now);
      A.blit(ctx, this.far);
      A.blit(ctx, this.fore);
      // dahan yang akan dianyam
      if (this.phase === 'weave' || this.phase === 'climbing') {
        for (let i = 0; i < 6; i++) {
          if (this.weaveOrder.indexOf(i) < this.woven) continue;
          const bend = this.bendAnim && this.bendAnim.i === i ? S.ease.inOut(this.bendAnim.p) : 0;
          A.drawBranch(ctx, this.weaveGeom(i, bend), { seed: 50 + i, w: 16, leafy: 0.8, moss: false });
        }
      }
      // daun alas
      if (this.phase === 'bed') {
        for (let i = 0; i < BED.length; i++) {
          if (this.bedTaken.has(i)) continue;
          const b = BED[i];
          for (let k = 0; k < 4; k++) A.drawLeaf(ctx, b.x - 6, b.y + 6, 40, -1.2 + k * 0.6, k % 2 ? '#7cc85a' : '#5aa845', '#2e5e25', 0.45);
        }
      }
      this.renderBakti(ctx, now);
      if (this.phase !== 'choose' && this.phase !== 'climbing') A.drawNest(ctx, F.x, F.y - 2, 0.95, this.woven / CFG.nest.weave, this.bed / CFG.nest.bed, now);
      for (const b of this.bedFly) {
        const e = S.ease.inOut(Math.min(1, b.p));
        const x = S.lerp(b.sx, F.x, e), y = S.lerp(b.sy, F.y, e) - Math.sin(e * Math.PI) * 60;
        for (let k = 0; k < 3; k++) A.drawLeaf(ctx, x, y, 36 * (1 - e * 0.4), -1 + k * 0.7, '#6bb84a', '#2e5e25', 0.45);
      }
      // gelap malam (target tetap terlihat di atasnya)
      const k = this.progress();
      ctx.fillStyle = `rgba(10,14,40,${(this.sleeping ? 0.5 : 0.55 * Math.pow(k, 1.6)).toFixed(3)})`;
      ctx.fillRect(0, 0, S.VW, S.VH);
      if (this.sleeping || k > 0.6) {
        for (const f of this.flies) {
          const x = f.x + Math.sin(now * 0.7 + f.ph) * 30, y = f.y + Math.cos(now * 0.9 + f.ph) * 20;
          ctx.fillStyle = `rgba(230,255,140,${0.4 + 0.5 * Math.sin(now * 3 + f.ph)})`;
          ctx.beginPath(); ctx.arc(x, y, 3.2, 0, S.TAU); ctx.fill();
        }
      }
      this.renderTargets(ctx, now);
      if (this.sleeping) {
        for (let i = 0; i < 3; i++) {
          const p = (now * 0.5 + i / 3) % 1;
          ctx.globalAlpha = 1 - p;
          A.text(ctx, 'z', F.x + 50 + p * 50, F.y - 110 - p * 90, 26 + i * 8, '#fff8d8', 'center', 900);
        }
        ctx.globalAlpha = 1;
      }
    }

    renderTargets(ctx, now) {
      if (this.phase === 'choose') {
        for (const sp of SPOTS) {
          if (this.wrongSpots.has(sp.id)) { A.mark(ctx, sp.x, sp.y, false, 1.3); continue; }
          A.glow(ctx, sp.x, sp.y, 54, now + sp.x, '#fff1b0');
          A.text(ctx, '?', sp.x, sp.y + 2, 46, '#fff6d0', 'center', 900);
        }
      } else if (this.phase === 'weave' && !this.bendAnim) {
        const gm = this.weaveGeom(this.weaveOrder[this.woven], 0);
        A.glow(ctx, (gm.x0 + gm.x1) / 2, (gm.y0 + gm.y1) / 2, 62, now);
      } else if (this.phase === 'bed') {
        for (let i = 0; i < BED.length; i++) if (!this.bedTaken.has(i)) A.glow(ctx, BED[i].x, BED[i].y, 46, now + i);
      }
    }

    renderBakti(ctx, now) {
      let x = this.pos.x, y = this.pos.y, pose;
      if (this.climb) {
        const e = S.ease.inOut(this.climb.p);
        x = S.lerp(this.climb.from.x, this.climb.to.x, e); y = S.lerp(this.climb.from.y, this.climb.to.y, e);
        pose = Math.floor(this.climb.p * 6) % 2 ? 'climb' : 'climb2';
      } else if (this.sleeping || this.forcedSleep) pose = 'sleep';
      else if (this.phase === 'choose') pose = Object.assign({}, A.OU_POSES.sit, { face: 'neutral', look: 0.3, head: -8 });
      else if (this.bendAnim) pose = 'bend';
      else pose = Object.assign({}, A.OU_POSES.idle, { look: Math.sin(now * 0.6) * 0.6 });
      A.drawOrangutan(ctx, x, y, this.scale, pose, { t: now, blinkSeed: 3.3 });
    }
  }
  L.nest = Nest;
})();

  <script>/* js/lessons/island.js */
/* Ujian akhir · Pulau pra-pelepasliaran: amati dan catat perilaku Bakti, jangan bantu.
   Godaan "beri makan" dan "elus" harus ditahan supaya Bakti tetap liar. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG, UI = S.UI;
  const L = (S.Lessons = S.Lessons || {});
  const BEHAVIORS = ['memanjat', 'makan', 'alat', 'sarang', 'menjauh'];
  const SP = {
    center: { x: 820, y: 612 }, shore: { x: 800, y: 742 },
    climbA: { x: 300, y: 540 }, climbB: { x: 300, y: 326 },
    nest: { x: 300, y: 214 }, eat: { x: 1186, y: 300 }, tool: { x: 676, y: 632 },
    awayA: { x: 980, y: 690 }, awayB: { x: 540, y: 610 }
  };
  const START = { memanjat: SP.climbA, makan: SP.eat, alat: SP.tool, sarang: SP.nest, menjauh: SP.awayA };

  class Island {
    constructor(g, o) {
      this.g = g; this.def = o.def; this.rng = S.rng(o.seed); this.t = 0;
      this.scale = 0.86 * o.s;
      this.queue = this.rng.shuffle(BEHAVIORS.slice());
      this.recorded = new Set();
      const dur = g.duration || 37;
      this.tempts = C.temptations.map((t, i) => Object.assign({}, t, { due: dur * CFG.island.temptAt[i], state: 'pending' }));
      this.pos = { x: SP.center.x, y: SP.center.y };
      this.nestBuilt = 0; this.boat = { x: 1900, show: false, leaving: false };
      this.eatUntil = -1; this.fly = null;
      this.bg = A.layer('island-back', A.bgIsland);
      this.front = A.layer('island-front', A.bgIslandFront);
      this.seg = null; this.finished = false;
      this.startSeg({ type: 'idle', dur: 1.2 });
    }
    resolved() { return this.tempts.filter((t) => t.state !== 'pending').length; }
    get total() { return BEHAVIORS.length + this.tempts.length; }
    count() { return this.recorded.size + this.resolved(); }
    objective() { return { text: S.tpl(this.def.objective, { n: this.count(), m: this.total }), frac: this.count() / this.total }; }
    get done() { return this.finished; }

    startSeg(seg) { seg.p = 0; seg.t = 0; seg.full = seg.dur; this.seg = seg; if (seg.type === 'tempt') this.openTempt(seg); if (seg.type === 'act' && seg.b === 'menjauh') { this.boat = { x: 1850, show: true, leaving: false }; } }
    moveTo(to, then) {
      const from = { x: this.pos.x, y: this.pos.y }, d = S.dist(from.x, from.y, to.x, to.y);
      if (d < 8) { this.startSeg(then); return; }
      this.startSeg({ type: 'move', from, to, dur: S.clamp(d / 520, 0.5, 1.2), then, vertical: Math.abs(to.x - from.x) < 40 });
    }

    nextSeg() {
      const prev = this.seg;
      if (prev.type === 'move') { this.startSeg(prev.then); return; }
      if (prev.type === 'act' && !this.recorded.has(prev.b)) this.queue.push(prev.b);
      if (this.recorded.size >= BEHAVIORS.length && this.resolved() >= this.tempts.length) { this.finished = true; this.startSeg({ type: 'idle', dur: 99 }); return; }
      const due = this.tempts.find((t) => t.state === 'pending' && this.t >= t.due);
      if (due && prev.type !== 'tempt') { this.moveTo(SP.shore, { type: 'tempt', tempt: due, dur: CFG.island.temptSec + 0.9 }); return; }
      if (prev.type === 'act' || prev.type === 'tempt') { this.startSeg({ type: 'idle', dur: this.rng.range(CFG.island.idleSec[0], CFG.island.idleSec[1]) }); return; }
      let b = this.queue.shift();
      while (b && this.recorded.has(b)) b = this.queue.shift();
      if (!b) {
        const pend = this.tempts.find((t) => t.state === 'pending');
        if (pend) { pend.due = this.t; this.moveTo(SP.shore, { type: 'tempt', tempt: pend, dur: CFG.island.temptSec + 0.9 }); }
        else this.startSeg({ type: 'idle', dur: 1 });
        return;
      }
      this.moveTo(START[b], { type: 'act', b, dur: CFG.island.actSec });
    }

    openTempt(seg) {
      const t = seg.tempt;
      const icon = this.g.icons[t.icon] || '';
      seg.ui = UI.showTempt(t, icon, CFG.island.temptSec, () => {
        if (this.destroyed) return;
        t.state = 'failed';
        this.g.bad(CFG.temptFail, SP.shore.x, SP.shore.y - 160, t.fail.title, t.fail.text);
        if (t.id === 'pisang') this.fly = { p: 0 };
        seg.dur = Math.min(seg.dur, seg.t + 1.6);
      }, () => {
        if (this.destroyed) return;
        t.state = 'passed';
        this.g.good(CFG.temptPass, SP.shore.x, SP.shore.y - 160, C.temptPassTitle);
        UI.bubble(SP.shore.x, SP.shore.y - 170, C.temptPassTitle, t.pass, true);
        seg.dur = Math.min(seg.dur, seg.t + 0.9);
      });
    }

    update(dt) {
      this.t += dt;
      const sg = this.seg;
      sg.t += dt; sg.p = Math.min(1, sg.t / sg.dur);
      const pa = Math.min(1, sg.t / sg.full); // progres animasi (tetap halus walau segmen dipersingkat)
      if (sg.type === 'move') {
        const e = S.ease.inOut(sg.p);
        this.pos.x = S.lerp(sg.from.x, sg.to.x, e);
        this.pos.y = S.lerp(sg.from.y, sg.to.y, e);
      } else if (sg.type === 'act') {
        if (sg.b === 'memanjat') { this.pos.x = SP.climbA.x; this.pos.y = S.lerp(SP.climbA.y, SP.climbB.y, S.ease.inOut(pa)); }
        if (sg.b === 'menjauh') { const e = S.ease.inOut(pa); this.pos.x = S.lerp(SP.awayA.x, SP.awayB.x, e); this.pos.y = S.lerp(SP.awayA.y, SP.awayB.y, e); }
        if (sg.b === 'sarang') this.nestBuilt = Math.max(this.nestBuilt, sg.p >= 1 ? 1 : pa);
      }
      if (this.fly) { this.fly.p += dt / 0.6; if (this.fly.p >= 1) { this.fly = null; this.eatUntil = this.t + 1.2; S.Audio.munch(); } }
      if (this.boat.show) {
        const target = this.boat.leaving ? 1900 : 1180;
        this.boat.x = S.approach(this.boat.x, target, this.boat.leaving ? 1.2 : 1.6, dt);
        if (this.boat.leaving && this.boat.x > 1850) this.boat.show = false;
      }
      if (sg.p >= 1) {
        if (sg.type === 'act' && sg.b === 'menjauh') this.boat.leaving = true;
        if (sg.type === 'tempt' && sg.tempt.state === 'pending') return; // menunggu tombol / waktu godaan
        this.nextSeg();
      }
    }

    pointer(x, y, tol) {
      const sg = this.seg, s = this.scale;
      const hit = S.dist(x, y, this.pos.x, this.pos.y - 48 * s) < 100 * s + tol;
      if (!hit) return false;
      if (sg.type === 'act') {
        const b = C.behaviors[sg.b];
        if (this.recorded.has(sg.b)) { this.g.float(x, y, C.already, '#cfe8ff'); return true; }
        this.recorded.add(sg.b); sg.recorded = true;
        sg.dur = Math.min(sg.dur, sg.t + 1.1); // setelah tercatat, Bakti lanjut ke kegiatan berikutnya
        S.Audio.pop();
        this.g.good(CFG.goodPoints, x, y, C.recorded + ': ' + b.name);
        UI.bubble(x, y - 40, b.name, b.text, true);
        return true;
      }
      if (sg.type === 'idle' && !this.finished) {
        this.g.bad(CFG.idlePenalty, x, y, C.idleTap.title, C.idleTap.text);
        return true;
      }
      return true;
    }

    destroy() { this.destroyed = true; if (this.seg && this.seg.ui) this.seg.ui.cancel(); UI.hideTempt(); }

    render(ctx, now) {
      A.blit(ctx, this.bg);
      // dahan pohon buah
      A.drawBranch(ctx, { x0: 1290, y0: 352, x1: 1090, y1: 336 }, { seed: 91, w: 26, leafy: 0.7 });
      for (let i = 0; i < 4; i++) A.drawFood(ctx, 'ara', 1230 + i * 30, 230 + (i % 2) * 24, 16, now);
      A.mossLog(ctx, 736, 900, 664, 46);
      if (this.nestBuilt > 0) A.drawNest(ctx, SP.nest.x, SP.nest.y + 8, 0.66, Math.min(1, this.nestBuilt * 1.2), Math.max(0, this.nestBuilt * 1.6 - 0.6), now);
      this.renderBakti(ctx, now);
      if (this.fly) {
        const e = S.ease.inOut(this.fly.p);
        A.drawFood(ctx, 'pisang', S.lerp(800, this.pos.x, e), S.lerp(880, this.pos.y - 70, e) - Math.sin(e * Math.PI) * 120, 30, now);
      }
      if (this.boat.show) A.drawBoat(ctx, this.boat.x, 800, 0.85, now);
      A.blit(ctx, this.front);
      this.renderNotebook(ctx, now);
    }

    renderBakti(ctx, now) {
      const sg = this.seg, s = this.scale;
      let pose, hold = null, flip = false, x = this.pos.x, y = this.pos.y;
      if (sg.type === 'move') {
        if (sg.vertical) pose = Math.floor(sg.t * 6) % 2 ? 'climb' : 'climb2';
        else { pose = Object.assign({}, A.OU_POSES.idle, { face: 'happy' }); y -= Math.abs(Math.sin(sg.p * Math.PI * 2)) * 34; flip = sg.to.x < sg.from.x; }
      } else if (sg.type === 'act') {
        switch (sg.b) {
          case 'memanjat': pose = Math.floor(sg.t * 5) % 2 ? 'climb' : 'climb2'; break;
          case 'makan': pose = 'eat'; hold = 'ara'; break;
          case 'alat': pose = Object.assign({}, A.OU_POSES.tool, { ra: [72 + Math.sin(now * 9) * 6, 94 + Math.sin(now * 9) * 8] }); hold = 'stick'; break;
          case 'sarang': pose = 'bend'; break;
          case 'menjauh': pose = Object.assign({}, A.OU_POSES.idle, { face: 'surprise', look: 1 }); y -= Math.abs(Math.sin(Math.min(1, sg.t / sg.full) * Math.PI * 3)) * 30; break;
        }
      } else if (sg.type === 'tempt') {
        pose = this.t < this.eatUntil ? 'eat' : 'beg';
        if (this.t < this.eatUntil) hold = 'pisang';
      } else {
        pose = Object.assign({}, A.OU_POSES[Math.floor(this.t / 2.5) % 3 === 1 ? 'scratch' : 'idle'], { look: Math.sin(now * 0.7) * 0.8 });
        if (this.t < this.eatUntil) { pose = 'eat'; hold = 'pisang'; }
      }
      if (this.seg.type !== 'move' && this.pos.y > 560 && this.pos.y < 760) {
        ctx.fillStyle = 'rgba(20,40,10,.25)'; ctx.beginPath(); ctx.ellipse(x, this.pos.y + 28 * s, 40 * s, 9 * s, 0, 0, S.TAU); ctx.fill();
      }
      A.drawOrangutan(ctx, x, y, s, pose, { t: now, hold, flip, blinkSeed: 4.1 });
    }

    renderNotebook(ctx, now) {
      const x = 140, y = 806, w = 1320, h = 80, step = 196, cx0 = x + 168;
      A.panel(ctx, x, y, w, h);
      A.text(ctx, C.notebookTitle.toUpperCase(), x + 22, y + 28, 15, '#ffda7e', 'left', 900);
      A.text(ctx, '✎', x + 22, y + 56, 22, '#ffda7e', 'left', 900);
      BEHAVIORS.forEach((b, i) => {
        const cx = cx0 + i * step, cy = y + h / 2, on = this.recorded.has(b);
        S.roundRect(ctx, cx - 6, cy - 22, step - 10, 44, 10);
        ctx.fillStyle = on ? 'rgba(126,217,87,.25)' : 'rgba(255,255,255,.07)'; ctx.fill();
        ctx.strokeStyle = on ? '#9fe07a' : 'rgba(255,255,255,.4)'; ctx.lineWidth = 2; ctx.strokeRect(cx + 2, cy - 10, 20, 20);
        if (on) { ctx.strokeStyle = '#bff0a0'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 11, cy + 7); ctx.lineTo(cx + 21, cy - 8); ctx.stroke(); }
        A.text(ctx, C.behaviors[b].name, cx + 30, cy + 1, 15, on ? '#e6ffd6' : '#f3f1e2', 'left', 800);
      });
      const tx = cx0 + 5 * step + 4;
      A.text(ctx, C.temptPassTitle, tx, y + 26, 14, '#ffda7e', 'left', 900);
      this.tempts.forEach((t, i) => {
        const cx = tx + 14 + i * 32, cy = y + 56;
        ctx.beginPath(); ctx.arc(cx, cy, 11, 0, S.TAU);
        ctx.fillStyle = t.state === 'passed' ? '#7ed957' : t.state === 'failed' ? '#e0614d' : 'rgba(255,255,255,.15)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    }
  }
  L.island = Island;
})();

  <script>/* js/lessons/release.js */
/* Penutup: hari pelepasliaran. Pintu kandang angkut terbuka, Bakti memanjat ke kanopi,
   menebar biji, dan bibit baru tumbuh. Bisa dilewati. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG, UI = S.UI;
  const CAGE = { x: 520, y: 816 }, BASE = { x: 1010, y: 826 }, TRUNK_X = 1078, BR = { x0: 1110, y0: 318, x1: 860, y1: 300 };
  const GRIP = { x: 968, y: 306 }, SEED_TO = { x: 840, y: 846 };
  const T = { door: 1.0, out: 2.3, climb: 3.4, look: 5.6, eat: 6.8, seed: 7.9, grow: 9.0, card: 10.8, end: 19 };

  class Release {
    constructor(g) {
      this.g = g; this.t = 0; this.done = false; this.cues = new Set();
      this.scale = 1.15;
      this.bg = A.layer('release', A.bgRelease);
      UI.banner(C.release.kicker, '', '');
    }
    cue(name, fn) { if (!this.cues.has(name)) { this.cues.add(name); fn(); } }
    update(dt) {
      this.t += dt;
      const t = this.t;
      if (t > T.door) this.cue('door', () => S.Audio.whoosh());
      if (t > T.out) this.cue('out', () => S.Audio.hoot());
      if (t > T.eat) this.cue('eat', () => S.Audio.munch());
      if (t > T.grow) this.cue('grow', () => S.Audio.grow());
      if (t > T.card) this.cue('card', () => S.Audio.fanfare());
      if (t > T.end) this.done = true;
    }
    skip() { this.done = true; }
    pointer() { if (this.t > T.card + 1.2) this.done = true; }

    baktiState(now) {
      const t = this.t, s = this.scale;
      const sitY = (y) => y - 26 * s;
      if (t < T.out) return null;
      if (t < T.climb) {
        const p = (t - T.out) / (T.climb - T.out), e = S.ease.inOut(p);
        return { x: S.lerp(CAGE.x, BASE.x, e), y: sitY(S.lerp(CAGE.y - 10, BASE.y, e)) - Math.abs(Math.sin(p * Math.PI * 3)) * 40, pose: Object.assign({}, A.OU_POSES.idle, { face: 'happy', look: 0.6 }) };
      }
      if (t < T.look) {
        const p = (t - T.climb) / (T.look - T.climb);
        return { x: S.lerp(BASE.x, TRUNK_X - 52, Math.min(1, p * 4)), y: S.lerp(sitY(BASE.y), GRIP.y + 150, S.ease.inOut(p)), pose: Math.floor(t * 6) % 2 ? 'climb' : 'climb2' };
      }
      const off = A.ouGrip('hang', s);
      if (t < T.eat) {
        const p = Math.min(1, (t - T.look) / 0.5);
        return { x: S.lerp(TRUNK_X - 52, GRIP.x - off.x, p), y: S.lerp(GRIP.y + 150, GRIP.y - off.y, p), pose: Object.assign({}, A.OU_POSES.lookBack, { face: 'happy' }) };
      }
      return { x: GRIP.x - 10, y: GRIP.y - 14 - 26 * s, pose: 'eat', hold: t < T.seed + 0.6 ? 'ara' : null };
    }

    render(ctx, now) {
      const t = this.t;
      A.blit(ctx, this.bg);
      A.drawBranch(ctx, BR, { seed: 97, w: 30, leafy: 0.9 });
      if (t < T.eat) for (let i = 0; i < 3; i++) A.drawFood(ctx, 'ara', 900 + i * 26, 286 + (i % 2) * 14, 15, now);
      const door = S.clamp((t - T.door) / 1.0, 0, 1);
      A.drawCage(ctx, CAGE.x, CAGE.y, 0.92, door);
      if (t < T.out) {
        const blink = Math.sin(t * 3) > 0.92;
        if (!blink) { ctx.fillStyle = '#ffd98a'; for (const dx of [-12, 12]) { ctx.beginPath(); ctx.arc(CAGE.x + dx, CAGE.y - 80, 5, 0, S.TAU); ctx.fill(); } }
      }
      // biji jatuh lalu tumbuh
      if (t > T.seed) {
        const p = S.clamp((t - T.seed) / 0.9, 0, 1);
        if (p < 1) { ctx.fillStyle = '#6b3d1c'; ctx.beginPath(); ctx.ellipse(S.lerp(GRIP.x - 20, SEED_TO.x, p), S.lerp(GRIP.y + 10, SEED_TO.y, p * p), 6, 4, p * 6, 0, S.TAU); ctx.fill(); }
      }
      if (t > T.grow) A.drawSapling(ctx, SEED_TO.x, SEED_TO.y, S.ease.outCubic(S.clamp((t - T.grow) / 1.6, 0, 1)), now);
      const b = this.baktiState(now);
      if (b) A.drawOrangutan(ctx, b.x, b.y, this.scale, b.pose, { t: now, hold: b.hold, blinkSeed: 5 });
      if (t > T.grow && t < T.grow + 2) A.sparkle(ctx, SEED_TO.x, SEED_TO.y - 60, 1.4, now);
      if (t > T.card && !this.hideCard) this.renderCard(ctx, now);
    }

    renderCard(ctx, now) {
      const a = S.clamp((this.t - T.card) / 0.6, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      const x = 90, y = 120, w = 680;
      ctx.fillStyle = 'rgba(255,249,235,.96)';
      S.roundRect(ctx, x, y, w, 430, 26); ctx.fill();
      ctx.strokeStyle = '#e6cf9d'; ctx.lineWidth = 3; ctx.stroke();
      A.text(ctx, C.release.kicker.toUpperCase(), x + 40, y + 52, 18, '#b26a10', 'left', 900);
      A.text(ctx, C.release.title, x + 40, y + 100, 44, '#105b58', 'left', 900);
      const line = CFG.releasedCount ? S.tpl(C.release.countLine, { n: CFG.releasedCount, y: CFG.releasedSince }) : C.release.fallbackLine;
      let yy = y + 150;
      yy += A.wrapText(ctx, line, x + 40, yy, w - 80, 34, 25, '#183c3a', 'left', 800) + 14;
      A.wrapText(ctx, C.release.seedLine, x + 40, yy, w - 80, 30, 21, '#4a5a4a', 'left', 700);
      if (this.t > T.card + 1.2) {
        ctx.globalAlpha = a * (0.6 + 0.4 * Math.sin(now * 4));
        A.text(ctx, C.release.tapHint, x + w - 40, y + 400, 19, '#267d66', 'right', 900);
      }
      ctx.restore();
    }
  }
  S.Release = Release;
})();

  <script>/* js/game.js */
/* Alur satu sesi: lima pelajaran berurutan (cara main → bermain → rapor), lalu hari pelepasliaran.
   Skor, penalti (skor minimum nol), bonus waktu, bintang, anti ketuk asal-asalan, dan teks melayang. */
(function () {
  'use strict';
  const S = window.SHB, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG, UI = S.UI;

  class Game {
    constructor(opts) {
      this.onEnd = opts.onEnd;
      this.icons = opts.icons || {};
      this.lesson = null; this.release = null;
      this.active = false; this.paused = true; this.ending = false;
      this.floaters = [];
      this.rng = S.rng(S.randomSeed());
    }

    start(lessonSec) {
      this.stop();
      this.lessonSec = lessonSec;
      this.idx = -1; this.score = 0; this.mistakes = 0; this.results = [];
      this.seenFacts = new Set();
      this.rng = S.rng(S.randomSeed());
      this.sessionOver = false;
      UI.hud.score(0);
      UI.hud.show(true);
      this.nextLesson();
    }

    stop() {
      if (this.lesson && this.lesson.destroy) this.lesson.destroy();
      this.lesson = null; this.release = null; this.finale = null;
      this.active = false; this.paused = true; this.ending = false;
      this.floaters = [];
      UI.cancelIntro(); UI.hideTool(); UI.hideTempt();
      S.Audio.rain(false);
      document.getElementById('btn-skip-cutscene').classList.add('hidden');
      UI.hud.show(false);
    }

    get def() { return C.lessons[this.idx]; }

    nextLesson() {
      if (this.lesson && this.lesson.destroy) this.lesson.destroy();
      this.idx++;
      if (this.idx >= C.lessons.length) { this.beginRelease(); return; }
      const def = this.def, Cls = S.Lessons[def.id];
      this.duration = Math.round(this.lessonSec * (CFG.lessonFactor[def.id] || 1));
      this.timeLeft = this.duration;
      this.lessonPoints = 0; this.lessonMistakes = 0; this.missTimes = []; this.lockUntil = 0;
      this.active = false; this.paused = true; this.ending = false; this.timeUp = false;
      this.lastTick = Math.ceil(this.timeLeft);
      this.lesson = new Cls(this, { seed: this.rng.seed(), s: 1 + this.idx * 0.06, def });
      UI.hud.show(true);
      UI.hud.lesson(this.idx, C.lessons.length, def.title);
      UI.hud.time(this.timeLeft, this.duration);
      this.syncObjective();
      UI.showIntro(def, this.idx, C.lessons.length, this.duration, this.icons, () => {
        this.active = true; this.paused = false;
        S.Audio.start();
        if (this.lesson.begin) this.lesson.begin();
      });
    }

    setPaused(on) { this.paused = !!on; }

    syncObjective() {
      if (!this.lesson) return;
      const o = this.lesson.objective();
      if (o.text !== this._objText || o.frac !== this._objFrac) { UI.hud.objective(o.text, o.frac); this._objText = o.text; this._objFrac = o.frac; }
    }

    /* ---------- dipanggil oleh pelajaran ---------- */
    good(n, x, y, label) {
      this.score += n; this.lessonPoints += n;
      UI.hud.score(this.score, 'bump');
      this.float(x, y, (label ? label + '  ' : '') + '+' + n, '#ffe27a');
      S.Audio.good();
    }
    bad(n, x, y, title, text) {
      const actual = Math.min(this.score, n);
      this.score -= actual; this.lessonPoints -= actual;
      this.mistakes++; this.lessonMistakes++;
      UI.hud.score(this.score, 'hurt');
      this.float(x, y, '−' + n, '#ff8a7a');
      if (title) UI.bubble(x, y, title, text || '');
      S.Audio.bad();
    }
    /* Kesalahan tanpa potongan poin (mis. hujan terlewat). */
    slip() { this.mistakes++; this.lessonMistakes++; }
    float(x, y, text, color) { this.floaters.push({ x, y, text, color: color || '#fff', t: 0 }); }

    /* ---------- loop ---------- */
    update(dt) {
      for (const f of this.floaters) f.t += dt;
      this.floaters = this.floaters.filter((f) => f.t < 1.3);
      if (this.release) { this.release.update(dt); if (this.release.done) this.end(); return; }
      if (!this.lesson) return;
      if (this.active && !this.paused) {
        if (!this.ending) {
          this.timeLeft = Math.max(0, this.timeLeft - dt);
          const sec = Math.ceil(this.timeLeft);
          if (sec < this.lastTick) { this.lastTick = sec; if (sec <= 5 && sec > 0) S.Audio.tick(); }
          UI.hud.time(this.timeLeft, this.duration);
        }
        if (!(this.ending && this.timeUp)) this.lesson.update(dt); // saat waktu habis, adegan dibekukan
        this.syncObjective();
        if (!this.ending && this.lesson.done) {
          this.ending = true; this.endTimer = this.lesson.finishDelay || 1.6;
          UI.banner(this.def.done, '', '');
          S.Audio.clear();
        } else if (!this.ending && this.timeLeft <= 0) {
          this.ending = true; this.timeUp = true; this.endTimer = 1.5;
          if (this.lesson.onTimeUp) this.lesson.onTimeUp();
          UI.banner(C.ui.lessonTimeUp, '', 'calm');
          S.Audio.over();
        }
        if (this.ending) { this.endTimer -= dt; if (this.endTimer <= 0) this.finishLesson(); }
      } else if (this.lesson.idle) this.lesson.idle(dt);
    }

    finishLesson() {
      this.active = false; this.paused = true;
      UI.hideTool(); UI.hideTempt(); UI.clearBubbles();
      const L = this.lesson, completed = !this.timeUp && L.done;
      let timeBonus = 0;
      if (completed) { timeBonus = Math.ceil(this.timeLeft) * CFG.timeBonusPerSec; this.score += timeBonus; UI.hud.score(this.score, 'bump'); }
      const o = L.objective();
      let stars;
      if (completed) stars = this.lessonMistakes <= 1 ? 3 : 2;
      else stars = o.frac >= 0.5 ? 1 : 0;
      const r = { id: this.def.id, completed, stars, points: Math.max(0, this.lessonPoints) + timeBonus, timeBonus, mistakes: this.lessonMistakes };
      this.results.push(r);
      if (L.destroy) L.destroy();
      const last = this.idx >= C.lessons.length - 1;
      UI.showReport(r, this.pickFact(this.def.id), last, () => this.nextLesson());
    }

    pickFact(id) {
      const ids = (C.lessonFacts[id] || []).filter((f) => !this.seenFacts.has(f));
      const pick = ids.length ? ids[Math.floor(this.rng() * ids.length)] : (C.lessonFacts[id] || [])[0];
      this.seenFacts.add(pick);
      return C.facts.find((f) => f.id === pick) || C.facts[0];
    }

    beginRelease() {
      this.lesson = null;
      UI.hud.show(false);
      this.release = new S.Release(this, {});
      const skip = document.getElementById('btn-skip-cutscene');
      skip.classList.remove('hidden');
    }
    skipRelease() { if (this.release) this.release.skip(); }

    end() {
      if (this.sessionOver) return;
      this.sessionOver = true;
      document.getElementById('btn-skip-cutscene').classList.add('hidden');
      const stars = this.results.reduce((a, r) => a + r.stars, 0);
      const lessons = {};
      for (const r of this.results) lessons[r.id] = r.points;
      const summary = {
        score: this.score, stars, maxStars: C.lessons.length * 3, mistakes: this.mistakes,
        timeBonus: this.results.reduce((a, r) => a + r.timeBonus, 0), lessons, results: this.results.slice()
      };
      this.release.hideCard = true;
      this.finale = this.release;
      this.release = null;
      this.onEnd(summary);
    }

    /* ---------- input ---------- */
    pointer(x, y, tol) {
      if (this.release) { this.release.pointer(x, y); return; }
      if (!this.lesson || !this.active || this.paused || this.ending) return;
      const now = S.now();
      if (now < this.lockUntil) return;
      const hit = this.lesson.pointer(x, y, tol);
      if (!hit) {
        S.Audio.miss();
        this.missTimes = this.missTimes.filter((t) => now - t < CFG.spamWindowSec).concat(now);
        if (this.missTimes.length >= CFG.spamMisses) {
          this.missTimes = []; this.lockUntil = now + CFG.spamLockSec;
          UI.banner(C.ui.calm, '', 'calm');
        }
      }
    }

    /* ---------- gambar ---------- */
    render(ctx, now) {
      if (this.release) this.release.render(ctx, now);
      else if (this.lesson) this.lesson.render(ctx, now);
      else if (this.finale) this.finale.render(ctx, now);
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '900 34px ' + S.FONT; ctx.lineJoin = 'round';
      for (const f of this.floaters) {
        const k = f.t / 1.3, y = f.y - 30 - k * 60;
        ctx.globalAlpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
        ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(20,30,20,.85)'; ctx.strokeText(f.text, f.x, y);
        ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
      }
      ctx.restore();
    }
  }
  S.Game = Game;
  S.Lessons = S.Lessons || {};
})();

  <script>/* js/main.js */
/* Titik masuk: ukuran layar, loop gambar, alur layar, mode kiosk, panel admin. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, CFG = window.SHB_CONFIG, C = window.SHB_CONTENT, UI = S.UI;
  const W = S.VW, H = S.VH;
  const $ = (id) => document.getElementById(id);
  const SETTINGS_KEY = 'shb.settings.v1';

  const stage = $('stage'), canvas = $('game'), ctx = canvas.getContext('2d');
  let state = 'boot', lastInput = S.now(), lastFrame = 0, vignette = null, vignR = 0;
  let pendingResult = null, lastEntryId = null, boardTimer = null;

  /* ---------- pengaturan ---------- */
  const settings = Object.assign({ lessonSec: CFG.lessonSec, sound: true }, loadSettings());
  if (!CFG.lessonOptions.includes(settings.lessonSec)) settings.lessonSec = CFG.lessonSec;
  function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}'); } catch (e) { return {}; } }
  function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) { /* abaikan */ } }
  function sessionMinutes() {
    const total = C.lessons.reduce((a, l) => a + settings.lessonSec * (CFG.lessonFactor[l.id] || 1), 0) + 40;
    return Math.max(1, Math.round(total / 30) / 2);
  }

  /* ---------- ukuran panggung 16:9 ---------- */
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    let w = vw, h = (vw * 9) / 16;
    if (h > vh) { h = vh; w = (vh * 16) / 9; }
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    document.documentElement.style.setProperty('--u', w / 100 + 'px');
    const dpr = window.devicePixelRatio || 1;
    const R = S.clamp((w * dpr) / W, 0.6, 1.6);
    if (R !== S.R) { S.R = R; A.dropLayer(''); }
    canvas.width = Math.round(W * S.R);
    canvas.height = Math.round(H * S.R);
  }

  /* ---------- layar awal: Bakti berayun di sulur ---------- */
  const attract = {
    t0: 0,
    render(now) {
      const t = now - this.t0;
      A.blit(ctx, A.layer('attract', (c, w, h) => {
        A.bgCanopyBack(c, w, h);
        A.drawTrunk(c, 1460, -20, h + 20, 130, { seed: 61 });
        A.drawFoliage(c, 1460, 60, 200, 62);
        A.drawFoliage(c, 1040, 40, 220, 63);
        A.drawBranch(c, A.branchGeom(1400, 120, 520, -1, 30), { seed: 64, w: 40, leafy: 0.8 });
        A.fern(c, 980, h, 1.1, '#2f6a32', true);
        A.fern(c, 1500, h, 1, '#2f6a32');
      }));
      const px = 1150, py = 104, len = 300, th = Math.sin(t * 1.3) * 0.22;
      const gx = px + Math.sin(th) * len, gy = py + Math.cos(th) * len;
      ctx.strokeStyle = '#4d5f2a'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.quadraticCurveTo(px + Math.sin(th) * len * 0.5 + 10, py + len * 0.5, gx, gy); ctx.stroke();
      const s = 1.55, off = A.ouGrip('hang', s);
      const pose = Object.assign({}, A.OU_POSES.hang, { body: -th * 40, look: 0.4 + Math.sin(t * 0.4) * 0.4 });
      A.drawOrangutan(ctx, gx - off.x, gy - off.y, s, pose, { t: now, blinkSeed: 0 });
      A.blit(ctx, A.layer('attract-front', (c) => {
        A.drawFoliage(c, 1600, 0, 170, 65, ['#1f4f2c', '#2e6b3a', '#3f8a45', '#5aa64c']);
        A.drawFoliage(c, 760, -30, 140, 66, ['#1f4f2c', '#2e6b3a', '#3f8a45', '#5aa64c']);
      }));
    }
  };

  let game = null;

  /* ---------- alur layar ---------- */
  function goto(next, data) {
    const prev = state;
    state = next;
    lastInput = S.now();
    UI.clearBubbles();
    clearTimeout(boardTimer);
    if (prev === 'attract') { UI.stopAttractFacts(); S.Audio.ambient(false); }
    if (next === 'attract') {
      game.stop();
      $('session-length').textContent = '±' + S.tpl(C.ui.minutes, { s: String(sessionMinutes()).replace('.', ',') });
      $('session-lessons').textContent = S.tpl(C.ui.lessonsMeta, { n: C.lessons.length });
      attract.t0 = S.now();
      UI.show('screen-attract');
      UI.renderMiniBoard();
      UI.startAttractFacts();
      if (settings.sound) S.Audio.ambient(true);
    } else if (next === 'briefing') {
      game.stop();
      UI.show('screen-briefing');
    } else if (next === 'play') {
      UI.show(null);
      game.start(settings.lessonSec);
    } else if (next === 'result') {
      pendingResult = data;
      showResult(data);
    } else if (next === 'board') {
      UI.show('screen-board');
      UI.renderBoards(data && data.highlight);
      boardTimer = setTimeout(() => { if (state === 'board') goto('attract'); }, CFG.boardAutoReturnSec * 1000);
    }
  }

  function returnToMenu(settingsAfter) {
    if (state !== 'play' || !window.confirm(C.ui.leaveConfirm)) return;
    pendingResult = null;
    S.Audio.click();
    goto('attract');
    if (settingsAfter) openAdmin();
  }

  function showResult(res) {
    UI.show('screen-result');
    UI.hud.show(false);
    $('result-score').textContent = res.score;
    $('result-rapor').innerHTML = C.lessons.map((l, i) => {
      const r = res.results[i] || { stars: 0 };
      return '<li><b>' + [0, 1, 2].map((k) => '<span class="' + (k < r.stars ? '' : 'off') + '">★</span>').join('') + '</b>' + UI.esc(l.short) + '</li>';
    }).join('');
    $('result-stars').textContent = res.stars + '/' + res.maxStars;
    $('result-mistakes').textContent = res.mistakes;
    $('result-rank').textContent = '#' + S.Leaderboard.wouldRank('today', res.score, res.mistakes);
    const ratio = res.stars / res.maxStars;
    $('result-title').textContent = C.ui.resultTitles[ratio >= 0.8 ? 2 : ratio >= 0.5 ? 1 : 0];
    $('result-action').textContent = C.actions[Math.floor(Math.random() * C.actions.length)];
    UI.setName('');
    S.Audio.fanfare();
  }
  function saveResult(skip) {
    if (!pendingResult) return;
    const r = pendingResult;
    const name = skip ? C.ui.defaultName : UI.cleanName(UI.getName());
    const e = S.Leaderboard.add({ name, score: r.score, stars: r.stars, mistakes: r.mistakes, timeBonus: r.timeBonus, lessons: r.lessons, rulesVersion: CFG.rulesVersion });
    lastEntryId = e.id;
    pendingResult = null;
    S.Audio.click();
    goto('board', { highlight: lastEntryId });
  }

  /* ---------- loop gambar ---------- */
  function frame(ts) {
    const now = ts / 1000;
    const dt = Math.min(0.05, lastFrame ? now - lastFrame : 0);
    lastFrame = now;
    ctx.setTransform(S.R, 0, 0, S.R, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const nowS = S.now();
    try {
      if (state === 'play' || state === 'result') { game.update(dt); game.render(ctx, nowS); }
      else attract.render(nowS);
    } catch (err) { console.error(err); }
    if (!vignette || vignR !== S.R) { vignette = A.vignette(W, H, S.R, 0.4); vignR = S.R; }
    ctx.drawImage(vignette, 0, 0, W, H);
    // kembali ke layar awal jika ditinggal (tidak saat pelajaran sedang berjalan)
    const playingNow = state === 'play' && ((game.active && !game.paused) || game.release);
    if (state !== 'attract' && !playingNow && !UI.isOpen('overlay-admin') && nowS - lastInput > CFG.idleTimeoutSec) goto('attract');
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  function toStage(e) {
    const r = canvas.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'play') return;
    e.preventDefault();
    const p = toStage(e), tol = e.pointerType === 'mouse' ? CFG.tolMouse : CFG.tolTouch;
    game.pointer(p.x, p.y, tol);
  });
  window.addEventListener('pointerdown', () => { lastInput = S.now(); S.Audio.unlock(); }, true);
  window.addEventListener('keydown', (e) => {
    lastInput = S.now();
    if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) { e.preventDefault(); if (state === 'play') returnToMenu(true); else openAdmin(); return; }
    if (UI.isOpen('overlay-admin')) return;
    if (e.key === 'Escape' && state === 'play') { e.preventDefault(); returnToMenu(); return; }
    if (state === 'result') {
      if (e.key === 'Enter') saveResult(false);
      else if (e.key === 'Backspace') { e.preventDefault(); UI.typeKey('DEL'); }
      else if (e.key === ' ') { e.preventDefault(); UI.typeKey('SPACE'); }
      else if (e.key.length === 1) UI.typeKey(e.key);
    } else if (state === 'attract' && (e.key === 'Enter' || e.key === ' ') && !UI.isOpen('overlay-program')) { S.Audio.unlock(); goto('briefing'); }
    else if (state === 'briefing' && (e.key === 'Enter' || e.key === ' ')) goto('play');
  });

  // mode kiosk: cegah zoom, menu klik kanan, seleksi
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('touchmove', (e) => { if (state === 'play') e.preventDefault(); }, { passive: false });

  /* ---------- tombol ---------- */
  function on(id, fn) { $(id).addEventListener('click', (e) => { e.stopPropagation(); fn(e); }); }
  $('screen-attract').addEventListener('click', () => { if (state === 'attract') { S.Audio.unlock(); S.Audio.click(); goto('briefing'); } });
  on('btn-start', () => { S.Audio.unlock(); S.Audio.click(); goto('briefing'); });
  on('btn-board', () => { S.Audio.click(); goto('board'); });
  on('btn-fullscreen', () => toggleFullscreen());
  on('btn-program', () => UI.overlay('overlay-program', true));
  on('btn-program-close', () => UI.overlay('overlay-program', false));
  $('overlay-program').addEventListener('click', (e) => e.stopPropagation());
  on('btn-program-source', () => window.open(CFG.programUrl, '_blank', 'noopener,noreferrer'));
  on('btn-go', () => { S.Audio.click(); goto('play'); });
  on('btn-play-menu', () => returnToMenu());
  on('btn-skip-cutscene', () => { S.Audio.click(); game.skipRelease(); });
  on('btn-save', () => saveResult(false));
  on('btn-skip', () => saveResult(true));
  on('btn-again', () => { S.Audio.click(); goto('briefing'); });
  on('btn-home', () => { S.Audio.click(); goto('attract'); });
  on('btn-mute', () => { settings.sound = !settings.sound; applySound(); saveSettings(); });

  function applySound() {
    S.Audio.setEnabled(settings.sound);
    $('btn-mute').classList.toggle('is-off', !settings.sound);
    if (settings.sound && state === 'attract') S.Audio.ambient(true);
  }
  function toggleFullscreen() {
    const d = document;
    if (!d.fullscreenElement && !d.webkitFullscreenElement) {
      const el = d.documentElement;
      (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
    } else (d.exitFullscreen || d.webkitExitFullscreen || function () {}).call(d);
  }

  /* ---------- admin ---------- */
  let hotTaps = [];
  $('admin-hotspot').addEventListener('click', (e) => {
    e.stopPropagation();
    const now = S.now();
    hotTaps = hotTaps.filter((t) => now - t < 3).concat(now);
    if (hotTaps.length >= 5) { hotTaps = []; openAdmin(); }
  });
  function openAdmin() {
    if (state === 'play') return;
    UI.overlay('overlay-admin', true);
    $('admin-pin').classList.remove('hidden');
    adminMsg('');
    $('admin-menu').classList.add('hidden');
    UI.askPin((pin) => {
      if (pin === String(CFG.adminPin)) { $('admin-pin').classList.add('hidden'); $('admin-menu').classList.remove('hidden'); renderAdmin(); }
      else UI.pinError();
    });
  }
  function closeAdmin() {
    UI.overlay('overlay-admin', false);
    if (state === 'attract') { UI.renderMiniBoard(); $('session-length').textContent = '±' + S.tpl(C.ui.minutes, { s: String(sessionMinutes()).replace('.', ',') }); }
    if (state === 'board') UI.renderBoards(lastEntryId);
  }
  function renderAdmin() {
    const dur = $('admin-durations');
    dur.innerHTML = '';
    for (const s of CFG.lessonOptions) {
      const b = document.createElement('button');
      b.className = 'btn' + (settings.lessonSec === s ? ' on' : '');
      b.textContent = S.tpl(C.ui.adminSeconds, { s });
      b.onclick = (e) => { e.stopPropagation(); settings.lessonSec = s; saveSettings(); renderAdmin(); };
      dur.appendChild(b);
    }
    const snd = $('admin-sound');
    snd.innerHTML = '';
    for (const v of [true, false]) {
      const b = document.createElement('button');
      b.className = 'btn' + (settings.sound === v ? ' on' : '');
      b.textContent = v ? C.ui.adminOn : C.ui.adminOff;
      b.onclick = (e) => { e.stopPropagation(); settings.sound = v; applySound(); saveSettings(); renderAdmin(); };
      snd.appendChild(b);
    }
  }
  on('btn-admin-cancel', closeAdmin);
  on('btn-admin-close', closeAdmin);
  $('overlay-admin').addEventListener('click', (e) => e.stopPropagation());
  function download(name, text, type) {
    const blob = new Blob([text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function adminMsg(text, err) { const m = $('admin-msg'); m.textContent = text || ''; m.classList.toggle('err', !!err); }
  on('btn-admin-export', () => download('skor-sekolah-hutan-bakti-' + S.Leaderboard.dayKey() + '.csv', '﻿' + S.Leaderboard.csv(), 'text/csv;charset=utf-8'));
  on('btn-admin-backup', () => {
    const stamp = S.Leaderboard.dayKey() + '-' + new Date().toTimeString().slice(0, 5).replace(':', '');
    download('cadangan-sekolah-hutan-bakti-' + stamp + '.json', JSON.stringify(S.Leaderboard.backup(settings), null, 1), 'application/json');
    adminMsg(C.ui.adminBackupDone);
  });
  on('btn-admin-import', () => { $('admin-import-file').value = ''; $('admin-import-file').click(); });
  $('admin-import-file').addEventListener('change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(String(rd.result).replace(/^﻿/, ''));
        const res = S.Leaderboard.importBackup(data);
        if (data && data.settings && typeof data.settings === 'object') {
          if (CFG.lessonOptions.includes(data.settings.lessonSec)) settings.lessonSec = data.settings.lessonSec;
          if (typeof data.settings.sound === 'boolean') settings.sound = data.settings.sound;
          saveSettings(); applySound(); renderAdmin();
        }
        adminMsg(S.tpl(C.ui.adminImported, res));
      } catch (err) { adminMsg(C.ui.adminImportFail, true); }
    };
    rd.onerror = () => adminMsg(C.ui.adminImportFail, true);
    rd.readAsText(f);
  });
  on('btn-admin-reset-today', () => { if (confirm(C.ui.adminConfirm)) S.Leaderboard.resetToday(); });
  on('btn-admin-reset-all', () => { if (confirm(C.ui.adminConfirm)) S.Leaderboard.resetAll(); });

  /* ---------- ikon (digambar dari seni kanvas yang sama) ---------- */
  function makeIcon(w, h, draw) {
    const c = S.makeCanvas(w * 2, h * 2), x = c.getContext('2d');
    x.scale(2, 2); draw(x, w, h);
    return c.toDataURL();
  }
  function buildIcons() {
    const icons = {};
    for (const k of A.FOOD_KINDS) icons[k] = A.foodIcon(k, 120);
    icons.branchGood = makeIcon(120, 120, (x) => A.drawBranch(x, A.branchGeom(4, 74, 110, 1, 14), { seed: 3, w: 22 }));
    icons.branchBad = makeIcon(120, 120, (x) => A.drawBranch(x, A.branchGeom(4, 70, 110, 1, 14), { rotten: true, seed: 4, w: 22, dryLeaves: true }));
    icons.nest = makeIcon(120, 120, (x) => { A.drawOrangutan(x, 60, 78, 0.5, 'sleep', { t: 0 }); A.drawNest(x, 60, 82, 0.62, 1, 1, 0); });
    icons.notebook = makeIcon(120, 120, (x) => {
      x.fillStyle = '#f6efd8'; x.strokeStyle = '#2b1a0e'; x.lineWidth = 3;
      S.roundRect(x, 26, 16, 70, 90, 8); x.fill(); x.stroke();
      x.strokeStyle = '#7aa0b8'; x.lineWidth = 2;
      for (let i = 0; i < 5; i++) { x.beginPath(); x.moveTo(36, 36 + i * 14); x.lineTo(86, 36 + i * 14); x.stroke(); }
      x.strokeStyle = '#2f9a55'; x.lineWidth = 4; x.beginPath(); x.moveTo(36, 50); x.lineTo(42, 56); x.lineTo(52, 44); x.stroke();
      x.fillStyle = '#e8a33a'; x.save(); x.translate(92, 70); x.rotate(0.6); x.fillRect(-5, -36, 10, 56); x.fillStyle = '#3a2a1a'; x.beginPath(); x.moveTo(-5, 20); x.lineTo(5, 20); x.lineTo(0, 30); x.fill(); x.restore();
    });
    icons.hand = makeIcon(120, 120, (x) => {
      x.fillStyle = '#e7b48d'; x.strokeStyle = '#2b1a0e'; x.lineWidth = 3;
      x.beginPath(); x.ellipse(60, 74, 26, 30, 0, 0, S.TAU); x.fill(); x.stroke();
      for (const [dx, h] of [[-18, 34], [-6, 42], [6, 42], [18, 34]]) { S.roundRect(x, 60 + dx - 6, 60 - h, 12, h + 8, 6); x.fill(); x.stroke(); }
      x.beginPath(); x.ellipse(32, 72, 8, 16, -0.7, 0, S.TAU); x.fill(); x.stroke();
    });
    icons.feed = makeIcon(120, 120, (x) => A.drawOrangutan(x, 60, 92, 0.62, 'eat', { t: 0.2, hold: 'ara' }));
    icons.climb = makeIcon(120, 120, (x) => { A.drawBranch(x, A.branchGeom(0, 18, 120, 1, 0), { seed: 5, w: 14 }); A.drawOrangutan(x, 60, 84, 0.52, 'hang', { t: 0 }); });
    icons.forage = makeIcon(120, 120, (x) => A.drawOrangutan(x, 56, 98, 0.52, 'umbrella', { t: 0, hold: 'umbrella' }));
    icons.island = makeIcon(120, 120, (x) => {
      x.fillStyle = '#5fa6b0'; x.beginPath(); x.ellipse(60, 100, 58, 16, 0, 0, S.TAU); x.fill();
      x.fillStyle = '#6fa845'; x.beginPath(); x.ellipse(60, 96, 44, 11, 0, 0, S.TAU); x.fill();
      A.drawOrangutan(x, 60, 80, 0.5, 'idle', { t: 0 });
    });
    return icons;
  }

  /* ---------- mulai ---------- */
  function boot() {
    resize();
    window.addEventListener('resize', resize);
    UI.init();
    const icons = buildIcons();
    UI.buildRoadmap({ feed: icons.feed, climb: icons.climb, forage: icons.forage, nest: icons.nest, island: icons.island });
    game = new S.Game({ icons, onEnd: (res) => goto('result', res) });
    applySound();
    goto('attract');
    $('loading').classList.add('done');
    requestAnimationFrame(frame);
    if ('wakeLock' in navigator) {
      const lock = () => navigator.wakeLock.request('screen').catch(() => {});
      lock();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') lock(); });
    }
    if (!window.SHB_SINGLE_FILE && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }

  // akses untuk pengujian otomatis
  S.debug = { get game() { return game; }, goto, get state() { return state; }, settings };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
