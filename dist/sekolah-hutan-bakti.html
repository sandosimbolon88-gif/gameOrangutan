/* ---------- tombol ---------- */

/* ---------- briefing ---------- */

.report-panel { width: 54%; text-align: center; padding-top: calc(var(--u) * 2.8); }

.tool-msg.ok { color: var(--green2); }

/* ---------- godaan (ujian pulau) ---------- */
.tempt { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 18; text-align: center; animation: pop .3s ease; pointer-events: none; }

/* ---------- papan skor ---------- */

.board-list li { display: flex; align-items: center; gap: calc(var(--u) * .8); padding: calc(var(--u) * .3) calc(var(--u) * .6); border-radius: calc(var(--u) * .6); }
.board-list li:nth-child(odd) { background: #faf3e2; }

/* ---------- kenali program ---------- */
.program-panel { width: 72%; }

/* ---------- admin ---------- */
.admin-panel { width: 50%; text-align: center; }

.hud-score { min-width: calc(var(--u) * 10); }
.hud-score .val { color: var(--amber2); }

@keyframes bump { 40% { transform: scale(1.3); } }

.hud-mid { text-align: center; min-width: calc(var(--u) * 34); }

.hud-progress span { display: block; height: 100%; width: 0; background: #ffd25e; transition: width .3s ease; }
.hud-time { min-width: calc(var(--u) * 11); text-align: right; }

.play-menu { position: absolute; right: 2.4%; top: calc(var(--u) * 8.4); z-index: 35; font-size: calc(var(--u) * .95); background: #082f35ed; color: #fff9e9; border: 1px solid #d5e2ca70; }

.banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); z-index: 15; pointer-events: none; opacity: 0;
  font-size: calc(var(--u) * 4.6); font-weight: 900; color: var(--amber2); white-space: nowrap; text-align: center;

  <script>/* js/util.js */
/* Utilitas bersama: RNG ber-seed, matematika kecil, format waktu, template teks. */
(function () {
  'use strict';
  const S = (window.SHB = window.SHB || {});
  S.VW = 1600;          // ukuran panggung virtual 16:9
  S.VH = 900;
  S.TAU = Math.PI * 2;
  S.R = 1;              // resolusi kanvas (diatur main.js)

  /* RNG ber-seed (mulberry32) supaya susunan bisa dibuat ulang persis sama. */
  S.rng = function (seed) {
    let a = (seed >>> 0) || 0x9e3779b9;
    const f = function () {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (lo, hi) => lo + (hi - lo) * f();
    f.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
    f.pick = (arr) => arr[Math.floor(f() * arr.length)];
    f.chance = (p) => f() < p;
    f.seed = () => Math.floor(f() * 4294967295) >>> 0;
    f.shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(f() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    };
    return f;
  };

  S.randomSeed = () => (Math.floor(Math.random() * 4294967295) >>> 0) || 1;
  S.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  S.lerp = (a, b, t) => a + (b - a) * t;
  S.now = () => performance.now() / 1000;
  S.rad = (d) => (d * Math.PI) / 180;
  S.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  /* Mendekat ke target secara halus, tidak bergantung frame rate. */
  S.approach = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));

  S.makeCanvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.ceil(w));
    c.height = Math.max(1, Math.ceil(h));
    return c;
  };

  S.ease = {
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inCubic: (t) => t * t * t,
    inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  };

  /* Jarak titik ke ruas garis (untuk sentuhan pada dahan). */
  S.segDist = function (px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = S.clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
  };

  S.roundRect = function (ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };

  S.fmtTime = function (sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  S.tpl = function (str, vars) {
    return String(str).replace(/\{(\w+)\}/g, (m, k) => (vars && k in vars ? vars[k] : m));
  };

  /* Campur dua warna hex (#rrggbb). */
  S.mixColor = function (a, b, t) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ch = (p, s) => (p >> s) & 255;
    const m = (s) => Math.round(ch(pa, s) + (ch(pb, s) - ch(pa, s)) * t);
    return 'rgb(' + m(16) + ',' + m(8) + ',' + m(0) + ')';
  };

  S.FONT ='"Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif';
})();

    good() { [784, 988, 1175].forEach((f, i) => tone(f, 0.14, 'sine', 0.2, i * 0.06)); },
    bad() { tone(240, 0.24, 'square', 0.07, 0, 130); },
    munch() { for (let i = 0; i < 3; i++) noise(0.06, 0.32, 900 + i * 300, 1.4, i * 0.11); },
    crack() { noise(0.12, 0.6, 700, 0.8); noise(0.25, 0.4, 260, 0.7, 0.05); tone(120, 0.3, 'sawtooth', 0.06, 0.02, 60); },
    whoosh() { noise(0.35, 0.22, 600, 0.6, 0, 'lowpass'); },
    rustle() { noise(0.18, 0.25, 3000, 0.9); noise(0.16, 0.2, 2200, 0.9, 0.08); },
    pop() { tone(520, 0.08, 'sine', 0.16, 0, 900); },
    clear() { [659, 784, 988, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.18, i * 0.09)); },
    star(i) { tone(880 * Math.pow(1.26, i || 0), 0.2, 'triangle', 0.16); },
    miss() { tone(300, 0.05, 'triangle', 0.05); },
    tick() { tone(1250, 0.04, 'square', 0.05); },
    over() { [784, 659, 523, 392].forEach((f, i) => tone(f, 0.24, 'triangle', 0.16, i * 0.13)); },
    start() { [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'sine', 0.16, i * 0.07)); },
    grow() { [392, 494, 587, 784, 988].forEach((f, i) => tone(f, 0.3, 'sine', 0.13, i * 0.12)); },
    fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.26, 'triangle', 0.16, i * 0.12)); },
    hoot() { tone(420, 0.18, 'sine', 0.12, 0, 620); tone(560, 0.22, 'sine', 0.1, 0.2, 380); },
    bird() {
      if (!ctx || !enabled) return;
      const base = 2200 + Math.random() * 1600, n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) tone(base, 0.09, 'sine', 0.035, i * 0.12, base * (1.2 + Math.random() * 0.3));
    },
    ambient(on) {
      if (ambientTimer) { clearTimeout(ambientTimer); ambientTimer = null; }
      if (!on) return;
      const loop = () => { AU.bird(); ambientTimer = setTimeout(loop, 2500 + Math.random() * 5000); };
      ambientTimer = setTimeout(loop, 1500);
    },
    rain(on) {
      if (rainNode) { try { rainNode.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.3); rainNode.s.stop(ctx.currentTime + 1.2); } catch (e) { /* abaikan */ } rainNode = null; }

      const g = ctx.createGain(); g.gain.value = 0.0001; g.gain.setTargetAtTime(0.12, ctx.currentTime, 0.4);
      s.connect(f); f.connect(g); g.connect(master); s.start();
      rainNode = { s, g };
    }
  });

  <script>/* js/art/orangutan.js */
/* Bakti, bayi orang utan kalimantan. Digambar dengan kode (kanvas), tanpa file gambar.
   Anatomi kartun tetap mengikuti alam: rambut jingga kemerahan yang panjang dan menjuntai,
   lengan jauh lebih panjang dari kaki, wajah kulit gelap dengan lingkar mata dan moncong pucat
   (khas anak orang utan), rambut kepala berdiri, tangan dan kaki sama-sama bisa menggenggam,
   dan TIDAK berekor (kera besar tidak punya ekor). */
(function () {
  'use strict';
  const S = window.SHB, A = (S.Art = S.Art || {});

  const C = {
    hair: '#d6631f', hairHi: '#f2a04f', hairLo: '#a4461b', line: '#4a1d08',
    skin: '#4b3129', skinHi: '#6e4c3f', pale: '#ebb893', paleLo: '#c98e6c',
    eye: '#231008', belly: '#bf561f'

  A.OU_COLORS = C;
  const L = { torso: 56, upper: 38, fore: 37, thigh: 22, shin: 21, headR: 22 };
  const D2R = Math.PI / 180;
  const dir = (a, len) => ({ x: Math.sin(a * D2R) * len, y: Math.cos(a * D2R) * len });

  /* Sudut sendi dalam derajat: 0 = ke bawah, 90 = ke kanan layar, 180 = ke atas, -90 = ke kiri.
     la/ll = lengan/kaki di sisi KIRI layar; ra/rl dicerminkan otomatis bila tidak ditulis. */
  const POSES = {
    sit:      { la: [-20, 10], ll: [-74, 30], face: 'happy' },
    idle:     { la: [-14, 4], ll: [-74, 30], face: 'neutral' },
    hang:     { la: [-166, -178], ll: [-16, 4], grip: 'lr', face: 'happy' },
    hangOne:  { la: [-166, -178], ra: [28, 14], ll: [-18, 4], rl: [26, 8], grip: 'l', face: 'happy' },
    reach:    { la: [-166, -178], ra: [148, 162], ll: [-34, 8], rl: [44, 14], grip: 'l', face: 'focus', body: 4 },
    climb:    { la: [-150, -174], ra: [118, 150], ll: [-62, 18], rl: [58, -22], grip: 'lr', face: 'focus', body: -4 },
    climb2:   { la: [-118, -150], ra: [150, 174], ll: [-58, 22], rl: [62, -18], grip: 'lr', face: 'focus', body: 4 },
    eat:      { la: [-20, 10], ra: [24, -156], ll: [-74, 30], front: 'r', face: 'chew', hand: 'r' },
    tool:     { la: [-20, 10], ra: [72, 94], ll: [-74, 30], face: 'focus', look: 0.6, hand: 'r' },
    umbrella: { la: [-20, 10], ra: [175, 180], ll: [-74, 30], face: 'happy', hand: 'r', grip: 'r' },
    beg:      { la: [-20, 10], ra: [42, 74], ll: [-74, 30], face: 'beg', head: 10, hand: 'r', open: 'r' },
    sleep:    { la: [-34, 64], ra: [34, -64], ll: [-74, 34], front: 'lr', face: 'sleep', head: 16 },
    scratch:  { la: [-20, 10], ra: [137, -133], ll: [-74, 30], front: 'r', face: 'neutral', look: -0.3 },
    bend:     { la: [-112, -152], ra: [112, 152], ll: [-74, 30], face: 'focus', grip: 'lr' },
    surprise: { la: [-46, -10], ll: [-74, 30], face: 'surprise' },
    sad:      { la: [-14, 18], ll: [-74, 30], face: 'sad', head: -6 },
    wave:     { la: [-20, 10], ra: [128, 168], ll: [-74, 30], face: 'happy', open: 'r' },
    swing:    { la: [-160, -172], ra: [-176, 176], ll: [-40, -10], rl: [8, -24], grip: 'lr', face: 'happy', body: 12 },
    lookBack: { la: [-166, -178], ra: [24, 12], ll: [-16, 4], rl: [24, 6], grip: 'l', face: 'happy', look: 0.9, head: -6 }
  };
  A.OU_POSES = POSES;

  function norm(p) {
    p = typeof p === 'string' ? POSES[p] || POSES.sit : p;
    const la = p.la || [-20, 10], ll = p.ll || [-74, 30];
    return {
      body: p.body || 0, head: p.head || 0, la, ll,
      ra: p.ra || [-la[0], -la[1]], rl: p.rl || [-ll[0], -ll[1]],
      front: p.front || '', grip: p.grip || '', open: p.open || '', hand: p.hand || 'r',
      face: p.face || 'happy', look: p.look || 0

  }
  A.ouPose = norm;

  /* Campuran dua pose (untuk transisi gerak yang halus). */
  A.ouMix = function (pa, pb, t) {
    const a = norm(pa), b = norm(pb), m = (x, y) => x + (y - x) * t;
    const arr = (x, y) => [m(x[0], y[0]), m(x[1], y[1])];
    const pick = t < 0.5 ? a : b;
    return { body: m(a.body, b.body), head: m(a.head, b.head), la: arr(a.la, b.la), ra: arr(a.ra, b.ra), ll: arr(a.ll, b.ll), rl: arr(a.rl, b.rl),
      front: pick.front, grip: pick.grip, open: pick.open, hand: pick.hand, face: pick.face, look: m(a.look, b.look) };
  };

  /* Posisi sendi relatif terhadap pinggul (satuan figur, sebelum skala). */
  A.ouJoints = function (pose) {
    const P = norm(pose), b = P.body, R = (x, y) => rot(x, y, b);
    const neck = R(0, -L.torso);
    const sl = R(-16, -L.torso + 8), sr = R(16, -L.torso + 8);
    const hl = R(-11, -6), hr = R(11, -6);
    const el = add(sl, dir(P.la[0] + b, L.upper)), wl = add(el, dir(P.la[1] + b, L.fore));
    const er = add(sr, dir(P.ra[0] + b, L.upper)), wr = add(er, dir(P.ra[1] + b, L.fore));
    const kl = add(hl, dir(P.ll[0] + b, L.thigh)), fl = add(kl, dir(P.ll[1] + b, L.shin));

  };

  /* Titik genggam (tengah kedua tangan, atau satu tangan) — untuk menggantung Bakti di dahan. */
  A.ouGrip = function (pose, s, flip) {
    const j = A.ouJoints(pose), P = j.P, f = flip ? -1 : 1;
    const hand = (w, e) => { const v = norm2(w.x - e.x, w.y - e.y); return { x: w.x + v.x * 5, y: w.y + v.y * 5 }; };
    const l = hand(j.wl, j.el), r = hand(j.wr, j.er);
    let p;
    if (P.grip.includes('l') && P.grip.includes('r')) p = { x: (l.x + r.x) / 2, y: Math.min(l.y, r.y) };
    else if (P.grip.includes('r')) p = r; else p = l;
    return { x: p.x * s * f, y: p.y * s };
  };
  function norm2(x, y) { const l = Math.hypot(x, y) || 1; return { x: x / l, y: y / l }; }

  function line(ctx, pts) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke(); }

  /* Untaian rambut menjuntai di sepanjang ruas tubuh. */
  function strands(ctx, a, b, w, n, len, seed) {
    const v = norm2(b.x - a.x, b.y - a.y), px = -v.y, py = v.x;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const t = 0.12 + (0.8 * (i + 0.5)) / n;

      const k = len * (0.75 + 0.5 * (((i * 7 + seed) % 5) / 5));

  function limb(ctx, a, b, c, w1, w2, seed) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = pass ? C.hair : C.line;
      const k = pass ? 0 : 5;
      ctx.lineWidth = w1 + k; line(ctx, [a, b]);
      ctx.lineWidth = w2 + k; line(ctx, [b, c]);

  function hand(ctx, w, e, grip, open) {

      ctx.beginPath(); ctx.ellipse(2.5, 0, 7.5, 6.4, 0, 0, S.TAU); ctx.fill(); ctx.stroke();

      ctx.beginPath(); ctx.moveTo(5, -2.6); ctx.lineTo(9, -2.2); ctx.moveTo(5.6, 0); ctx.lineTo(9.6, 0.4); ctx.moveTo(5, 2.6); ctx.lineTo(9, 2.8); ctx.stroke();

    ctx.strokeStyle = C.skinHi; ctx.lineWidth = 1.2;

  }

  function torso(ctx, body) {
    ctx.save(); ctx.rotate(-body * D2R);
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(0, -L.torso - 3);
      ctx.bezierCurveTo(16, -L.torso - 3, 22, -44, 24, -25);
      ctx.bezierCurveTo(26, -6, 22, 9, 0, 10);
      ctx.bezierCurveTo(-22, 9, -26, -6, -24, -25);
      ctx.bezierCurveTo(-22, -44, -16, -L.torso - 3, 0, -L.torso - 3);

      ctx.beginPath();
      for (let y = -42, i = 0; y <= 4; y += 7.5, i++) {
        for (const s of [-1, 1]) {

          ctx.moveTo(x, y - 5); ctx.lineTo(x + s * (6 + (i % 2) * 2.5), y + 6); ctx.lineTo(x - s * 1, y + 4);

      ctx.moveTo(-14, 7); ctx.lineTo(-10, 15); ctx.lineTo(-6, 9);
      ctx.moveTo(14, 7); ctx.lineTo(10, 15); ctx.lineTo(6, 9);

    ctx.strokeStyle = C.hairLo; ctx.lineWidth = 1.6; ctx.globalAlpha = 0.8;

      ctx.moveTo(s * 15, -36); ctx.quadraticCurveTo(s * 21, -22, s * 18, -6);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.strokeStyle = C.hairHi; ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-12, -48); ctx.quadraticCurveTo(-19, -36, -19, -24); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.restore();
  }

  function head(ctx, h, P, o) {
    ctx.save(); ctx.translate(h.x, h.y); ctx.rotate(-(P.body + P.head) * D2R);
    const lk = P.look * 4.2, r = L.headR;
    const t = o.t || 0;
    const blink = P.face === 'sleep' || ((t + (o.blinkSeed || 0)) % 4.3) < 0.13;
    // rambut kepala berdiri (khas anak orang utan) + bentuk kepala
    const crown = () => {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, S.TAU);
      const n = 7;
      for (let i = 0; i < n; i++) {
        const a = (-158 + (116 * i) / (n - 1)) * D2R, w = 0.2, L2 = r + 9 + (i % 2 ? 2 : 5) + (i === 3 ? 3 : 0);
        ctx.moveTo(Math.cos(a - w) * (r - 3), Math.sin(a - w) * (r - 3));
        ctx.lineTo(Math.cos(a + (i - 3) * 0.04) * L2, Math.sin(a + (i - 3) * 0.04) * L2);
        ctx.lineTo(Math.cos(a + w) * (r - 3), Math.sin(a + w) * (r - 3));
      }
      // jambang di pipi
      for (const s of [-1, 1]) { ctx.moveTo(s * (r - 2), 2); ctx.lineTo(s * (r + 6), 10); ctx.lineTo(s * (r - 4), 12); }
    };
    ctx.lineJoin = 'round';
    ctx.strokeStyle = C.line; ctx.lineWidth = 5; crown(); ctx.stroke();
    ctx.fillStyle = C.hair; crown(); ctx.fill();
    ctx.strokeStyle = C.hairHi; ctx.globalAlpha = 0.6; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, r - 5, -2.6, -1.5); ctx.stroke(); ctx.globalAlpha = 1;
    // telinga kecil
    ctx.fillStyle = C.skin; ctx.strokeStyle = C.line; ctx.lineWidth = 1.8;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * (r - 3) + lk * 0.3, 1, 3.6, 4.6, 0, 0, S.TAU); ctx.fill(); ctx.stroke(); }

    ctx.fillStyle = C.skin; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(lk, -15);
    ctx.bezierCurveTo(lk + 12, -17, lk + 18, -8, lk + 17, 3);
    ctx.bezierCurveTo(lk + 16, 15, lk + 9, 22, lk, 22);
    ctx.bezierCurveTo(lk - 9, 22, lk - 16, 15, lk - 17, 3);
    ctx.bezierCurveTo(lk - 18, -8, lk - 12, -17, lk, -15);
    ctx.fill(); ctx.stroke();
    // lingkar mata dan moncong pucat
    ctx.fillStyle = C.pale;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(lk + s * 7.4, -3, 7.2, 6.6, s * 0.15, 0, S.TAU); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(lk * 1.1, 12, 10.5, 8.6, 0, 0, S.TAU); ctx.fill();
    ctx.fillStyle = C.paleLo; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.ellipse(lk * 1.1, 16, 7.5, 3.6, 0, 0, S.TAU); ctx.fill(); ctx.globalAlpha = 1;
    // mata
    const ex = (s) => lk * 1.15 + s * 7;
    ctx.strokeStyle = C.eye; ctx.fillStyle = C.eye; ctx.lineCap = 'round';

      ctx.lineWidth = 1.8;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(ex(s), -3, 3.6, 0.2, Math.PI - 0.2); ctx.stroke(); }
    } else {
      const big = P.face === 'beg' || P.face === 'surprise' ? 1.2 : 1;
      for (const s of [-1, 1]) {
        ctx.fillStyle = C.eye; ctx.beginPath(); ctx.arc(ex(s) + P.look * 0.8, -3, 4.9 * big, 0, S.TAU); ctx.fill();

      }
    }
    // alis untuk ekspresi
    ctx.strokeStyle = C.skin; ctx.lineWidth = 2;
    if (P.face === 'sad' || P.face === 'beg') {
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex(s) - s * 5, -11); ctx.lineTo(ex(s) + s * 3, -13.5); ctx.stroke(); }
    } else if (P.face === 'surprise') {
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(ex(s), -10, 4, 3.6, 5.8); ctx.stroke(); }
    } else if (P.face === 'focus') {
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex(s) - s * 4, -11.5); ctx.lineTo(ex(s) + s * 4, -10); ctx.stroke(); }
    }
    // hidung
    ctx.fillStyle = C.skin;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(lk * 1.1 + s * 2.4, 8.5, 1.4, 1.1, 0, 0, S.TAU); ctx.fill(); }
    // mulut
    ctx.strokeStyle = C.line; ctx.lineWidth = 1.9; ctx.fillStyle = '#6a2f22';
    const mx = lk * 1.1, my = 15;
    const f = P.face;
    ctx.beginPath();
    if (f === 'happy') { ctx.moveTo(mx - 5.5, my - 0.5); ctx.quadraticCurveTo(mx, my + 5, mx + 5.5, my - 0.5); ctx.stroke(); }
    else if (f === 'sad') { ctx.moveTo(mx - 4.5, my + 2.5); ctx.quadraticCurveTo(mx, my - 1.5, mx + 4.5, my + 2.5); ctx.stroke(); }
    else if (f === 'surprise') { ctx.ellipse(mx, my + 1, 2.6, 3.4, 0, 0, S.TAU); ctx.fill(); ctx.stroke(); }
    else if (f === 'beg') { ctx.ellipse(mx, my + 1, 2.2, 1.8, 0, 0, S.TAU); ctx.fill(); ctx.stroke(); }
    else if (f === 'chew') {
      const open = Math.sin(t * 15) > 0;
      if (open) { ctx.ellipse(mx, my + 1, 3.6, 2.6, 0, 0, S.TAU); ctx.fill(); ctx.stroke(); }
      else { ctx.moveTo(mx - 4, my + 1); ctx.lineTo(mx + 4, my + 1); ctx.stroke(); }
    } else if (f === 'sleep') { ctx.moveTo(mx - 3, my + 1); ctx.quadraticCurveTo(mx, my + 2.5, mx + 3, my + 1); ctx.stroke(); }
    else { ctx.moveTo(mx - 4, my + 1); ctx.quadraticCurveTo(mx, my + 2, mx + 4, my + 1); ctx.stroke(); }
    ctx.restore();
  }

  /* Gambar Bakti. (x, y) = titik pinggul di dunia; s = skala (1 ≈ tinggi 150 satuan saat duduk tegak). */
  A.drawOrangutan = function (ctx, x, y, s, pose, o) {
    o = o || {};
    const j = A.ouJoints(pose), P = j.P;
    ctx.save();
    ctx.translate(x, y);
    if (o.flip) ctx.scale(-1, 1);
    ctx.scale(s, s);
    if (o.alpha != null) ctx.globalAlpha = o.alpha;
    if (o.shadow) {
      ctx.fillStyle = 'rgba(20,30,10,.28)';
      ctx.beginPath(); ctx.ellipse(0, o.shadow, 44, 9, 0, 0, S.TAU); ctx.fill();
    }
    // kaki di belakang badan
    limb(ctx, j.hl, j.kl, j.fl, 15, 12, 1); foot(ctx, j.fl, j.kl, -1);
    limb(ctx, j.hr, j.kr, j.fr, 15, 12, 2); foot(ctx, j.fr, j.kr, 1);
    const arm = (side) => {
      const sh = side === 'l' ? j.sl : j.sr, el = side === 'l' ? j.el : j.er, wr = side === 'l' ? j.wl : j.wr;
      limb(ctx, sh, el, wr, 15, 12.5, side === 'l' ? 4 : 6);
      hand(ctx, wr, el, P.grip.includes(side), P.open.includes(side));
    };
    if (!P.front.includes('l')) arm('l');
    if (!P.front.includes('r')) arm('r');
    torso(ctx, P.body);
    head(ctx, j.head, P, o);
    if (P.front.includes('l')) arm('l');
    if (P.front.includes('r')) arm('r');
    if (o.hold) drawHeld(ctx, j, P, o.hold, o.t || 0);
    ctx.restore();
    return j;
  };

  function drawHeld(ctx, j, P, hold, t) {
    const side = P.hand === 'l' ? 'l' : 'r';
    const w = side === 'l' ? j.wl : j.wr, e = side === 'l' ? j.el : j.er;
    const v = norm2(w.x - e.x, w.y - e.y);
    const hx = w.x + v.x * 6, hy = w.y + v.y * 6;
    if (hold === 'stick') {
      ctx.strokeStyle = '#4a2e18'; ctx.lineCap = 'round'; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(hx - v.x * 6, hy - v.y * 6); ctx.lineTo(hx + v.x * 46, hy + v.y * 46); ctx.stroke();
      ctx.strokeStyle = '#8a6239'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(hx - v.x * 4, hy - v.y * 4); ctx.lineTo(hx + v.x * 44, hy + v.y * 44); ctx.stroke();
    } else if (hold === 'umbrella') {
      ctx.save(); ctx.translate(hx, hy - 2);
      A.drawBigLeaf(ctx, 0, 0, 0.9, Math.PI + 0.12, true);
      ctx.restore();
    } else if (hold === 'leafSponge') {
      ctx.save(); ctx.translate(hx, hy); ctx.rotate(Math.atan2(v.y, v.x));
      ctx.fillStyle = '#5f9a3c'; ctx.strokeStyle = '#26431b'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(10, 0, 12, 8, 0.3, 0, S.TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.arc(14, 6, 2.2, 0, S.TAU); ctx.fill();
      ctx.restore();
    } else if (typeof hold === 'string' && A.drawFood) {
      A.drawFood(ctx, hold, hx, hy, 13, t);
    }
  }
})();

      ctx.fillStyle = '#ffe08a';

      ctx.fillStyle = '#fff'; ctx.font = '900 11px ' + S.FONT; ctx.textAlign = 'center'; ctx.fillText('KERIPIK', 1, -18);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-22, -28, 5, 54);
    },
    /* alat */
    ranting(ctx) {
      ctx.lineCap = 'round';
      ctx.strokeStyle = OUT; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(-36, 26); ctx.lineTo(34, -24); ctx.moveTo(4, 2); ctx.lineTo(10, -22); ctx.stroke();
      ctx.strokeStyle = '#8a6239'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-36, 26); ctx.lineTo(34, -24); ctx.moveTo(4, 2); ctx.lineTo(10, -22); ctx.stroke();
      A.drawLeaf(ctx, 10, -22, 18, -1.2, '#5aa845', '#2e5e25');
    },
    daunLebar(ctx) { A.drawBigLeaf(ctx, -40, 18, 0.78, -0.45, false); },
    batu(ctx) {
      ctx.beginPath(); ctx.moveTo(-34, 18); ctx.quadraticCurveTo(-36, -14, -8, -22); ctx.quadraticCurveTo(26, -28, 34, 0); ctx.quadraticCurveTo(38, 22, 10, 24); ctx.closePath();
      ctx.fillStyle = '#9aa0a2'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.6; ctx.stroke();
      ctx.fillStyle = '#c3c8c9'; ctx.beginPath(); ctx.ellipse(-8, -8, 12, 6, -0.3, 0, S.TAU); ctx.fill();
      ctx.fillStyle = '#7d8486'; ctx.beginPath(); ctx.ellipse(14, 10, 8, 4, 0.3, 0, S.TAU); ctx.fill();
    },
    pisang(ctx) {
      ctx.fillStyle = '#5b3a1c'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.4;
      S.roundRect(ctx, -6, -40, 12, 14, 3); ctx.fill(); ctx.stroke();
      for (const [a, c] of [[-0.55, '#f2c932'], [0.55, '#f2c932'], [0, '#ffe066']]) {
        ctx.save(); ctx.translate(0, -28); ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(-6, 0); ctx.bezierCurveTo(-30, 18, -26, 52, 4, 64);
        ctx.bezierCurveTo(8, 66, 10, 62, 8, 60);
        ctx.bezierCurveTo(-10, 46, -8, 18, 8, 2); ctx.closePath();
        ctx.fillStyle = c; ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(160,110,20,.5)'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-2, 6); ctx.bezierCurveTo(-18, 22, -16, 46, 2, 58); ctx.stroke();
        ctx.fillStyle = '#4a3218'; ctx.beginPath(); ctx.arc(5, 62, 2.6, 0, S.TAU); ctx.fill();
        ctx.strokeStyle = OUT; ctx.lineWidth = 2.4;
        ctx.restore();
      }
    }
  };
  A.FOOD_KINDS = Object.keys(FOOD);

  /* Gambar makanan/alat di (x,y) dengan jari-jari kira-kira r. */
  A.drawFood = function (ctx, kind, x, y, r, t) {
    const f = FOOD[kind];
    if (!f) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(r / 44, r / 44);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    f(ctx, t || 0);
    ctx.restore();
  };

  /* Ikon makanan sebagai gambar (untuk tombol DOM). */
  const iconCache = {};
  A.foodIcon = function (kind, size) {
    const key = kind + size;
    if (iconCache[key]) return iconCache[key];
    const c = S.makeCanvas(size * 2, size * 2), ctx = c.getContext('2d');
    ctx.scale(2, 2);
    A.drawFood(ctx, kind, size / 2, size / 2, size * 0.4);
    return (iconCache[key] = c.toDataURL());
  };

  /* Panel info di dalam kanvas (gaya sama dengan HUD). */
  A.panel = function (ctx, x, y, w, h, title) {
    ctx.save();
    S.roundRect(ctx, x, y, w, h, 16);
    ctx.fillStyle = 'rgba(7,45,53,.88)'; ctx.fill();
    ctx.strokeStyle = 'rgba(231,241,216,.25)'; ctx.lineWidth = 1.5; ctx.stroke();
    if (title) {
      ctx.fillStyle = '#ffda7e'; ctx.font = '900 17px ' + S.FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(title.toUpperCase(), x + 16, y + 12);
    }
    ctx.restore();
  };
  A.text = function (ctx, str, x, y, size, col, align, weight) {
    ctx.font = (weight || 800) + ' ' + size + 'px ' + S.FONT;
    ctx.fillStyle = col || '#fff'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
  };
  /* Teks dibungkus per baris; mengembalikan tinggi total. */
  A.wrapText = function (ctx, str, x, y, maxW, lh, size, col, align, weight) {
    ctx.font = (weight || 800) + ' ' + size + 'px ' + S.FONT;
    ctx.fillStyle = col || '#fff'; ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
    const words = String(str).split(' '); let line = '', yy = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, yy); line = w; yy += lh; }
      else line = test;
    }
    if (line) { ctx.fillText(line, x, yy); yy += lh; }
    return yy - y;
  };

  /* ---------------- tanda & efek ---------------- */
  A.glow = function (ctx, x, y, r, t, col) {
    const p = 0.5 + 0.5 * Math.sin(t * 5);
    ctx.save();
    ctx.strokeStyle = col || '#ffe27a'; ctx.lineWidth = 4 + p * 3; ctx.globalAlpha = 0.5 + p * 0.45;
    ctx.setLineDash([12, 9]); ctx.lineDashOffset = -t * 30;
    ctx.beginPath(); ctx.arc(x, y, r + p * 6, 0, S.TAU); ctx.stroke();
    ctx.restore();
  };
  A.sparkle = function (ctx, x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.5); ctx.scale(s, s);
    ctx.fillStyle = '#fff6c2'; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 8);
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = (i / 8) * S.TAU, r = i % 2 ? 4 : 14; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(r, 0); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  A.mark = function (ctx, x, y, ok, s) {
    s = s || 1;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    circle(ctx, 0, 0, 19, ok ? '#2f9a55' : '#d0442f', '#fff', 3.5);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    if (ok) { ctx.moveTo(-8, 1); ctx.lineTo(-2, 8); ctx.lineTo(9, -7); } else { ctx.moveTo(-7, -7); ctx.lineTo(7, 7); ctx.moveTo(7, -7); ctx.lineTo(-7, 7); }
    ctx.stroke();
    ctx.restore();
  };

  /* ---------------- dahan (pelajaran memanjat) ---------------- */
  /* Dahan dari batang di (x0,y0) ke arah side (-1 kiri, 1 kanan). rotten = dahan lapuk. */
  A.branchGeom = function (x0, y0, len, side, lift) {
    return { x0, y0, x1: x0 + side * len, y1: y0 - (lift || 18) };
  };
  A.drawBranch = function (ctx, g, o) {
    o = o || {};
    const rnd = S.rng(o.seed || 7);
    const rotten = !!o.rotten, side = Math.sign(g.x1 - g.x0) || 1;
    const len = Math.hypot(g.x1 - g.x0, g.y1 - g.y0), ang = Math.atan2(g.y1 - g.y0, g.x1 - g.x0);
    ctx.save(); ctx.translate(g.x0, g.y0); ctx.rotate(ang);
    if (o.drop) { ctx.translate(len * 0.5, 0); ctx.rotate(o.drop * side); ctx.translate(-len * 0.5, o.dropY || 0); ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; }
    const w0 = o.w || 26, w1 = rotten ? w0 * 0.42 : w0 * 0.32;
    // daun di ujung (di belakang dahan)
    if (!rotten) {
      const leafy = o.leafy == null ? 1 : o.leafy, n = Math.round(4 + leafy * 7);
      for (let i = 0; i < n; i++) {
        const t = 0.62 + (i / n) * 0.42, a = -1.9 + rnd() * 3.8;
        A.drawLeaf(ctx, len * t, (rnd() - 0.5) * 8, 30 + rnd() * 18, a, i % 3 ? '#4f9a3a' : '#6bb84a', '#2b5a1f');
      }
    } else if (o.dryLeaves) {
      for (let i = 0; i < 3; i++) A.drawLeaf(ctx, len * (0.7 + i * 0.1), 2, 22, 1.2 + rnd() * 1.4, '#a8834a', '#6b4a23');
    }
    // badan dahan
    ctx.beginPath();
    ctx.moveTo(0, -w0 / 2);
    ctx.quadraticCurveTo(len * 0.5, -w0 * 0.42 - 4, len, -w1 / 2);
    if (rotten) {
      // ujung patah bergerigi
      ctx.lineTo(len + 6, -w1 * 0.2); ctx.lineTo(len - 2, 0); ctx.lineTo(len + 8, w1 * 0.3); ctx.lineTo(len, w1 / 2);
    } else ctx.quadraticCurveTo(len + w1 * 0.6, 0, len, w1 / 2);
    ctx.quadraticCurveTo(len * 0.5, w0 * 0.42 + 2, 0, w0 / 2);
    ctx.closePath();
    const g2 = ctx.createLinearGradient(0, -w0 / 2, 0, w0 / 2);
    if (rotten) { g2.addColorStop(0, '#b3a58f'); g2.addColorStop(1, '#7c705f'); }
    else { g2.addColorStop(0, '#8a5d3a'); g2.addColorStop(1, '#5a3a22'); }
    ctx.fillStyle = g2; ctx.fill();
    ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
    // tekstur kulit kayu
    ctx.strokeStyle = rotten ? '#5f5547' : '#3f2716'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) { const x = 18 + i * len / 7, y = (rnd() - 0.5) * w0 * 0.4; ctx.moveTo(x, y); ctx.lineTo(x + 22, y + (rnd() - 0.5) * 3); }
    ctx.stroke();
    if (!rotten) {
      ctx.strokeStyle = 'rgba(255,220,170,.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(8, -w0 * 0.3); ctx.quadraticCurveTo(len * 0.5, -w0 * 0.34, len * 0.9, -w1 * 0.3); ctx.stroke();
      if (o.moss !== false) {
        ctx.fillStyle = '#6fa043';
        for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(30 + i * 34 + rnd() * 10, -w0 * 0.36, 9, 4, 0, 0, S.TAU); ctx.fill(); }
      }
    } else {
      // retakan
      const subtle = o.subtle ? 0.6 : 1;
      ctx.strokeStyle = '#2a1f14'; ctx.lineWidth = 2.6 * subtle; ctx.lineJoin = 'miter';
      for (const cx of [len * 0.32, len * 0.62]) {
        ctx.beginPath(); ctx.moveTo(cx, -w0 * 0.38); ctx.lineTo(cx + 6, -w0 * 0.1); ctx.lineTo(cx - 3, w0 * 0.08); ctx.lineTo(cx + 5, w0 * 0.32); ctx.stroke();
      }
      // lubang rayap
      ctx.fillStyle = '#3b3128';
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(len * (0.2 + i * 0.18), (rnd() - 0.5) * w0 * 0.3, 2.2, 0, S.TAU); ctx.fill(); }
      // jamur kuping
      const nf = o.subtle ? 1 : 2;
      for (let i = 0; i < nf; i++) {
        const fx = len * (0.45 + i * 0.25), fy = -w0 * 0.42;
        ctx.beginPath(); ctx.ellipse(fx, fy, 15 * subtle + 3, 7, 0, Math.PI, 0);
        ctx.fillStyle = i ? '#e9c58a' : '#f0e2c4'; ctx.fill(); ctx.strokeStyle = '#7a5a2a'; ctx.lineWidth = 2; ctx.stroke();
        ctx.strokeStyle = '#b48a4a'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.ellipse(fx, fy, 9 * subtle + 2, 4, 0, Math.PI, 0); ctx.stroke();
      }
    }
    ctx.restore();
  };

  /* Sulur/akar gantung. */
  A.drawLiana = function (ctx, x0, y0, x1, y1, sag, w, col) {
    ctx.strokeStyle = col || '#4d5f2a'; ctx.lineWidth = w || 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo((x0 + x1) / 2, Math.max(y0, y1) + sag, x1, y1); ctx.stroke();
  };

  /* Batang pohon besar hutan Kalimantan dengan akar papan (banir). */
  A.drawTrunk = function (ctx, x, yTop, yBot, w, o) {
    o = o || {};
    const rnd = S.rng(o.seed || 3);
    const col = o.col || '#6b4a33', dark = o.dark || '#4a3222', hi = o.hi || '#8d6a4e';
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - w * 0.42, yTop); ctx.lineTo(x + w * 0.42, yTop);
    if (o.buttress) {
      ctx.lineTo(x + w * 0.5, yBot - w * 1.2); ctx.quadraticCurveTo(x + w * 0.62, yBot - w * 0.3, x + w * 1.5, yBot);
      ctx.lineTo(x - w * 1.5, yBot); ctx.quadraticCurveTo(x - w * 0.62, yBot - w * 0.3, x - w * 0.5, yBot - w * 1.2);
    } else { ctx.lineTo(x + w * 0.5, yBot); ctx.lineTo(x - w * 0.5, yBot); }
    ctx.closePath();
    const g = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
    g.addColorStop(0, dark); g.addColorStop(0.35, hi); g.addColorStop(0.7, col); g.addColorStop(1, dark);
    ctx.fillStyle = g; ctx.fill();
    if (o.outline !== false) { ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.clip();
    ctx.strokeStyle = dark; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
    const h = yBot - yTop;
    for (let i = 0; i < h / 26; i++) {
      const yy = yTop + i * 26 + rnd() * 12, xx = x - w * 0.35 + rnd() * w * 0.7;
      ctx.beginPath(); ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + (rnd() - 0.5) * 6, yy + 14, xx + (rnd() - 0.5) * 4, yy + 30); ctx.stroke();
    }
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#7fa64a';
    for (let i = 0; i < h / 90; i++) { ctx.beginPath(); ctx.ellipse(x - w * 0.3 + rnd() * w * 0.2, yTop + rnd() * h, 6 + rnd() * 8, 14 + rnd() * 10, 0, 0, S.TAU); ctx.fill(); }
    ctx.restore();
  };

  /* Gerombol daun (tajuk). */
  A.drawFoliage = function (ctx, x, y, r, seed, pal, o) {
    o = o || {};
    const rnd = S.rng(seed || 1);
    pal = pal || ['#2e6b3a', '#3f8a45', '#5aa64c', '#8cc65a'];
    const n = o.n || Math.round(10 + r / 6);
    // bayangan dasar
    ctx.fillStyle = pal[0];
    ctx.beginPath();
    for (let i = 0; i < 9; i++) { const a = (i / 9) * S.TAU; ctx.moveTo(x + Math.cos(a) * r * 0.55 + r * 0.42, y + Math.sin(a) * r * 0.42); ctx.arc(x + Math.cos(a) * r * 0.55, y + Math.sin(a) * r * 0.42, r * 0.42, 0, S.TAU); }
    ctx.fill();
    for (let k = 1; k < pal.length; k++) {
      for (let i = 0; i < n / pal.length + 2; i++) {
        const a = rnd() * S.TAU, d = rnd() * r * (0.75 - k * 0.12);
        const lx = x + Math.cos(a) * d, ly = y + Math.sin(a) * d * 0.8 - k * r * 0.06;
        A.drawLeaf(ctx, lx, ly, r * (0.32 + rnd() * 0.18), rnd() * S.TAU, pal[k], o.vein ? pal[0] : null, 0.42);
      }
    }
  };

  /* Sarang dari dahan yang dianyam: mangkuk dahan dengan bibir daun. weave & bed: 0..1
     (x, y) = bibir atas sarang. Gambar Bakti lebih dulu agar badan bawahnya tertutup sarang. */
  A.drawNest = function (ctx, x, y, s, weave, bed, t) {
    if (weave <= 0 && bed <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const k = S.clamp(weave, 0, 1), rx = 54 + 30 * k, ry = 12 + 34 * k;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // mangkuk
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI); ctx.closePath();
    ctx.fillStyle = '#5b3d22'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI); ctx.closePath(); ctx.clip();
    const n = Math.max(2, Math.round(4 + k * 8));
    for (let i = 0; i < n; i++) {
      const yy = (i / n) * ry, w = rx * Math.sqrt(Math.max(0.05, 1 - Math.pow(yy / (ry + 1), 2)));
      ctx.strokeStyle = i % 2 ? '#8a6038' : '#a3743f'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-w - 6, yy + (i % 2 ? 3 : -2)); ctx.quadraticCurveTo(0, yy + 9, w + 6, yy + (i % 2 ? -2 : 3)); ctx.stroke();
    }
    ctx.restore();
    // ujung ranting mencuat dan daun di bibir
    for (let i = 0; i < Math.round(3 + k * 9); i++) {
      const a = Math.PI * (0.04 + (i / 12) * 0.92), px = Math.cos(a) * rx, py = Math.sin(a) * ry * 0.35;
      A.drawLeaf(ctx, px, py, 22 + (i % 3) * 6, (px > 0 ? -0.5 : Math.PI + 0.5) + (i % 2 ? 0.3 : -0.2), i % 2 ? '#4f9a3a' : '#3f8a35', '#2b5a1f');
    }
    // bibir sarang
    ctx.strokeStyle = OUT; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, 9, 0, 0, Math.PI); ctx.stroke();
    ctx.strokeStyle = '#94683f'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, 9, 0, 0, Math.PI); ctx.stroke();
    // alas daun
    const m = Math.round(bed * 8);
    for (let i = 0; i < m; i++) {
      const px = -rx * 0.75 + (i % 4) * rx * 0.5 + (i > 3 ? rx * 0.2 : 0), py = -3 - (i > 3 ? 5 : 0);
      A.drawLeaf(ctx, px - 14, py, 34, -0.15 + (i % 3) * 0.15, i % 2 ? '#6bb84a' : '#5aa845', '#2e5e25', 0.5);
    }
    ctx.restore();
  };

  /* Lubang di batang (sarang rayap / genangan air). */
  A.drawHollow = function (ctx, x, y, s, kind, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath(); ctx.ellipse(0, 0, 22, 30, 0, 0, S.TAU);
    ctx.fillStyle = '#5a3d27'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 3, 15, 23, 0, 0, S.TAU); ctx.fillStyle = '#1d120a'; ctx.fill();
    if (kind === 'air') {
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, 3, 15, 23, 0, 0, S.TAU); ctx.clip();
      ctx.fillStyle = '#3d7ea8'; ctx.fillRect(-16, 8 + Math.sin(t * 2) * 1.5, 32, 20);
      ctx.fillStyle = 'rgba(200,240,255,.7)'; ctx.fillRect(-10, 9 + Math.sin(t * 2) * 1.5, 12, 2.5);
      ctx.restore();
    } else if (kind === 'rayap') {
      for (let i = 0; i < 6; i++) {
        const a = t * 1.2 + i * 1.05, px = Math.cos(a) * 10, py = 4 + Math.sin(a * 1.3) * 14;
        ctx.fillStyle = '#f4e3c0'; ctx.beginPath(); ctx.ellipse(px, py, 4, 2.2, a, 0, S.TAU); ctx.fill();
      }
      ctx.fillStyle = '#a7743f';
      ctx.beginPath(); ctx.ellipse(-14, 24, 12, 7, 0.3, 0, S.TAU); ctx.ellipse(12, 26, 10, 6, -0.3, 0, S.TAU); ctx.fill();
    }
    ctx.restore();
  };

  /* Kandang angkut untuk pelepasliaran. door: 0 (tertutup) .. 1 (terbuka) */
  A.drawCage = function (ctx, x, y, s, door) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 4, 110, 14, 0, 0, S.TAU); ctx.fill();
    S.roundRect(ctx, -95, -150, 190, 150, 10);
    ctx.fillStyle = '#3c5a63'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#1c2a2e'; ctx.fillRect(-78, -132, 156, 120);
    ctx.save(); ctx.beginPath(); ctx.rect(-78, -132, 156, 120); ctx.clip();
    ctx.fillStyle = '#5c7c84';
    const dy = -door * 124;
    for (let i = 0; i < 8; i++) ctx.fillRect(-74 + i * 20, -132 + dy, 7, 120);
    ctx.fillRect(-78, -80 + dy, 156, 7);
    ctx.restore();
    ctx.fillStyle = '#c9a24a'; ctx.fillRect(-95, -160, 190, 14);
    ctx.strokeRect(-95, -160, 190, 14);
    ctx.restore();
  };

  /* Perahu kecil dengan petugas (siluet). */
  A.drawBoat = function (ctx, x, y, s, t) {
    ctx.save(); ctx.translate(x, y + Math.sin(t * 2) * 2); ctx.scale(s, s); ctx.rotate(Math.sin(t * 1.6) * 0.02);
    // petugas
    ctx.fillStyle = '#23423f';
    ctx.beginPath(); ctx.ellipse(10, -46, 16, 22, 0, 0, S.TAU); ctx.fill();
    ctx.fillStyle = '#c99a72'; ctx.beginPath(); ctx.arc(10, -76, 11, 0, S.TAU); ctx.fill();
    ctx.fillStyle = '#e1c46a'; ctx.beginPath(); ctx.ellipse(10, -84, 19, 5, 0, 0, S.TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -88, 9, 6, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#6b4a23'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-14, -60); ctx.lineTo(-40, 8); ctx.stroke();
    // perahu
    ctx.beginPath(); ctx.moveTo(-90, -24); ctx.lineTo(96, -24); ctx.quadraticCurveTo(80, 8, 50, 10); ctx.lineTo(-60, 10); ctx.quadraticCurveTo(-84, 6, -90, -24); ctx.closePath();
    ctx.fillStyle = '#8b5a33'; ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#b07a48'; ctx.fillRect(-84, -24, 176, 7);
    ctx.restore();

  /* Bibit pohon tumbuh (penutup cerita). g: 0..1 */

  A.blit = function (ctx, layer) { ctx.drawImage(layer, 0, 0, S.VW, S.VH); };

  A.farForest = function (ctx, w, h, layers, seed) {

    for (const L of layers) {
      ctx.fillStyle = L.col;

        const r = L.r * (0.7 + rnd() * 0.6), y = L.y + (rnd() - 0.5) * L.r * 0.9;

/* Papan skor lokal (satu perangkat), disimpan di localStorage, dengan ekspor CSV dan cadangan JSON. */
(function () {
  'use strict';
  const S = window.SHB;
  const KEY = 'shb.leaderboard.v1', APP = 'sekolah-hutan-bakti';
  const LESSONS = ['feed', 'climb', 'forage', 'nest', 'island'];
  let memory = []; // cadangan jika localStorage tidak tersedia

  function dayKey(d) {
    d = d || new Date();
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function cmp(a, b) { return b.score - a.score || (a.mistakes || 0) - (b.mistakes || 0) || a.ts - b.ts; }
  const int = (v, max) => Math.max(0, Math.min(max || 100000, Math.floor(Number(v) || 0)));

  const LB = (S.Leaderboard = {
    dayKey, LESSONS,
    load() {
      try {
        const raw = localStorage.getItem(KEY);
        const a = raw ? JSON.parse(raw) : [];
        return Array.isArray(a) ? a : [];
      } catch (e) { return memory.slice(); }
    },
    saveAll(a) {
      const trimmed = a.slice(-5000);
      memory = trimmed;
      try { localStorage.setItem(KEY, JSON.stringify(trimmed)); } catch (e) { /* abaikan */ }
    },
    add(entry) {
      const a = LB.load();
      const e = Object.assign({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), ts: Date.now(), day: dayKey() }, entry);
      a.push(e);
      LB.saveAll(a);
      return e;
    },
    sorted(scope) {
      let a = LB.load();
      if (scope === 'today') { const k = dayKey(); a = a.filter((e) => e.day === k); }
      return a.sort(cmp);
    },
    top(scope, n) { return LB.sorted(scope).slice(0, n); },
    /* Peringkat yang akan didapat jika skor ini disimpan sekarang. */
    wouldRank(scope, score, mistakes) {
      const probe = { score, mistakes, ts: Date.now() };
      return LB.sorted(scope).filter((e) => cmp(e, probe) < 0).length + 1;
    },
    resetToday() { const k = dayKey(); LB.saveAll(LB.load().filter((e) => e.day !== k)); },
    resetAll() { LB.saveAll([]); },
    backup(settings) {
      return { app: APP, format: 1, exportedAt: new Date().toISOString(), settings: settings || null, leaderboard: LB.load() };
    },
    /* Gabungkan skor dari file cadangan (skor yang sudah ada tidak digandakan). */
    importBackup(data) {
      const list = Array.isArray(data) ? data : data && Array.isArray(data.leaderboard) ? data.leaderboard : null;
      if (!list || (data && data.app && data.app !== APP)) throw new Error('format');
      const cur = LB.load();
      const seen = new Set(cur.map((e) => e.id || e.ts + '|' + e.name));
      let added = 0, skipped = 0;
      for (const raw of list) {
        if (!raw || typeof raw !== 'object') { skipped++; continue; }
        const score = Math.floor(Number(raw.score)), ts = Number(raw.ts) || Date.now();
        if (!isFinite(score) || score < 0 || score > 100000) { skipped++; continue; }
        const e = {
          id: typeof raw.id === 'string' && raw.id ? raw.id.slice(0, 40) : ts.toString(36) + Math.random().toString(36).slice(2, 7),
          ts,
          day: typeof raw.day === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(raw.day) ? raw.day : dayKey(new Date(ts)),
          name: String(raw.name || '').slice(0, 20) || 'Pengasuh',
          score,
          stars: int(raw.stars, 15),
          mistakes: int(raw.mistakes),
          timeBonus: int(raw.timeBonus),
          lessons: {},
          rulesVersion: int(raw.rulesVersion, 99) || 1
        };
        for (const k of LESSONS) e.lessons[k] = int(raw.lessons && raw.lessons[k]);
        if (seen.has(e.id) || seen.has(e.ts + '|' + e.name)) { skipped++; continue; }
        seen.add(e.id);
        cur.push(e);
        added++;
      }
      cur.sort((a, b) => a.ts - b.ts);
      LB.saveAll(cur);
      return { added, skipped };
    },
    csv() {
      const rows = [['tanggal', 'waktu', 'nama', 'skor', 'bintang', 'salah_langkah', 'bonus_waktu', 'poin_makan', 'poin_memanjat', 'poin_cari_makan', 'poin_sarang', 'poin_pulau', 'versi_aturan']];
      for (const e of LB.load().sort((a, b) => a.ts - b.ts)) {
        const d = new Date(e.ts), l = e.lessons || {};
        rows.push([e.day, d.toLocaleTimeString('id-ID'), e.name, e.score, e.stars || 0, e.mistakes || 0, e.timeBonus || 0, l.feed || 0, l.climb || 0, l.forage || 0, l.nest || 0, l.island || 0, e.rulesVersion || 1]);
      }
      return rows.map((r) => r.map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
    }
  });
})();

    UI.buildKeyboard();

  /* ---------- layar ---------- */
  const screens = ['screen-attract', 'screen-briefing', 'overlay-intro', 'overlay-report', 'overlay-tool', 'screen-result', 'screen-board', 'overlay-program'];
  UI.show = function (id) { for (const s of screens) $(s).classList.toggle('active', s === id); };

  /* ---------- briefing: peta lima pelajaran ---------- */
  UI.buildRoadmap = function (icons) {

  /* ---------- banner & gelembung ---------- */
  let bannerTimer = null;
  UI.banner = function (title, sub, cls) {

    b.innerHTML = esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '');

  let temptTimer = null;
  UI.showTempt = function (t, icon, sec, onPress, onTimeout) {

  };
  UI.hideTempt = () => { clearTimeout(temptTimer); $('tempt').classList.add('hidden'); };

  /* ---------- layar awal ---------- */
  let factIdx = 0, factInt = null;
  UI.startAttractFacts = function () {
    const facts = S.rng(S.randomSeed()).shuffle(C.facts.slice());
    const put = () => {

    };
    clearInterval(factInt);

  UI.stopAttractFacts = () => clearInterval(factInt);

  function listHTML(entries, highlightId, n) {
    if (!entries.length) return '<li class="empty">' + esc(C.ui.empty) + '</li>';
    return entries.slice(0, n).map((e, i) => '<li' + (e.id === highlightId ? ' class="me"' : '') + '><span class="n">' + (i + 1) + '</span><span class="nm">' + esc(e.name) + '</span><span class="sc">' + e.score + '</span></li>').join('');
  }
  UI.renderMiniBoard = function () {
    const top = S.Leaderboard.top('today', 5);
    $('attract-top').innerHTML = top.length ? listHTML(top, null, 5) : '<li class="empty">' + esc(C.ui.noScores) + '</li>';
  };
  UI.renderBoards = function (highlightId) {
    const fit = (list) => {
      const top = list.slice(0, 10);
      if (highlightId && !top.some((e) => e.id === highlightId)) {
        const i = list.findIndex((e) => e.id === highlightId);
        if (i >= 0) return { top: top.slice(0, 9), extra: { e: list[i], rank: i + 1 } };
      }
      return { top, extra: null };
    };
    for (const [id, list] of [['board-today', S.Leaderboard.sorted('today')], ['board-all', S.Leaderboard.sorted('all')]]) {
      const f = fit(list);
      let html = listHTML(f.top, highlightId, 10);
      if (f.extra) html += '<li class="me"><span class="n">' + f.extra.rank + '</span><span class="nm">' + esc(f.extra.e.name) + '</span><span class="sc">' + f.extra.e.score + '</span></li>';
      $(id).innerHTML = html;
    }
  };

  /* ---------- hasil & nama ---------- */
  let nameBuf = '';
  UI.setName = function (s) { nameBuf = s.slice(0, CFG.nameMaxLen); $('name-text').textContent = nameBuf; };
  UI.getName = () => nameBuf;
  UI.typeKey = function (k) {
    if (k === 'DEL') UI.setName(nameBuf.slice(0, -1));
    else if (k === 'SPACE') { if (nameBuf && !nameBuf.endsWith(' ')) UI.setName(nameBuf + ' '); }
    else if (/^[A-Za-z0-9]$/.test(k)) UI.setName(nameBuf + k.toUpperCase());
  };
  UI.buildKeyboard = function () {
    const rows = ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'], kb = $('keyboard');
    kb.innerHTML = '';
    const keyBtn = (label, code, cls) => {
      const b = document.createElement('button');
      b.className = 'key' + (cls ? ' ' + cls : '');
      b.textContent = label;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); S.Audio.click(); UI.typeKey(code); });
      return b;
    };
    rows.forEach((row, ri) => {
      const r = document.createElement('div'); r.className = 'kb-row';
      for (const ch of row) r.appendChild(keyBtn(ch, ch));
      if (ri === 2) r.appendChild(keyBtn(C.ui.del, 'DEL', 'mid'));
      kb.appendChild(r);
    });
    const r = document.createElement('div'); r.className = 'kb-row';
    r.appendChild(keyBtn(C.ui.space, 'SPACE', 'wide'));
    kb.appendChild(r);
  };
  UI.cleanName = function (raw) {
    const name = (raw || '').trim().replace(/\s+/g, ' ');
    if (!name) return C.ui.defaultName;
    const low = name.toLowerCase(), squashed = low.replace(/[^a-z]/g, ''), words = low.split(/[^a-z]+/);
    for (const w of C.blockedWords) if (w.length <= 4 ? words.includes(w) : squashed.includes(w)) return C.ui.defaultName;
    return name;
  };

  /* ---------- PIN admin ---------- */
  let pinBuf = '', pinCb = null;
  UI.buildPinpad = function () {
    const pad = $('pinpad');
    pad.innerHTML = '';
    for (const k of ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'DEL', '0', 'OK']) {
      const b = document.createElement('button');
      b.className = 'key';
      b.textContent = k === 'DEL' ? '⌫' : k === 'OK' ? '✓' : k;
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (k === 'DEL') pinBuf = pinBuf.slice(0, -1);
        else if (k === 'OK') { if (pinCb) pinCb(pinBuf); return; }
        else if (pinBuf.length < 8) pinBuf += k;
        renderPin();
      });
      pad.appendChild(b);
    }
  };
  function renderPin(err) {
    const d = $('pin-display');
    d.classList.toggle('err', !!err);
    d.textContent = err ? C.ui.adminWrong : '•'.repeat(pinBuf.length);
  }
  UI.askPin = function (cb) { pinBuf = ''; pinCb = cb; renderPin(); };
  UI.pinError = function () { pinBuf = ''; renderPin(true); };
})();

  <script>/* js/lessons/feed.js */
/* Pelajaran 1 · Nursery: beri Bakti makanan hutan, tolak makanan manusia, lengkapi menu sehat. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG;
  const L = (S.Lessons = S.Lessons || {});
  const ITEM_Y = 726, SPAWN_X = 1700, HIT_R = 60;
  const CATS = ['buah', 'daun', 'kulit', 'serangga'];
  const KINDS = { buah: ['ara', 'rambutan', 'durian'], daun: ['daun', 'bunga'], kulit: ['kulit', 'rotan'], serangga: ['rayap', 'madu'] };
  const CAT_ICON = { buah: 'ara', daun: 'daun', kulit: 'kulit', serangga: 'rayap' };
  const BAD = Object.keys(C.badFood);

  class Feed {
    constructor(g, o) {
      this.g = g; this.def = o.def; this.rng = S.rng(o.seed); this.t = 0;
      this.cfg = CFG.feed; this.need = this.cfg.perCategory;
      this.scale = 1.75 * o.s;
      this.got = { buah: 0, daun: 0, kulit: 0, serangga: 0 };
      this.items = []; this.fly = []; this.badRun = 0; this.lastKind = '';
      this.bakti = { x: 385, y: 600 - 24 * this.scale, eatKind: null, eatUntil: -1, sadUntil: -1 };
      this.bg = A.layer('feed', A.bgNursery);
      for (let x = 760; x < SPAWN_X; x += this.cfg.gap) this.spawn(x);
    }
    get total() { return CATS.length * this.need; }
    count() { return CATS.reduce((a, c) => a + Math.min(this.got[c], this.need), 0); }
    objective() { const n = this.count(); return { text: S.tpl(this.def.objective, { n, m: this.total }), frac: n / this.total }; }
    get done() { return this.count() >= this.total && this.fly.length === 0; }

    spawn(x) {
      const r = this.rng;
      let good = r() < this.cfg.goodRatio;
      if (this.badRun >= 2) good = true;
      let kind;
      if (good) {
        const open = CATS.filter((c) => this.got[c] + this.fly.filter((f) => f.cat === c).length < this.need);
        const pool = open.length && r() < 0.8 ? open : CATS;
        const cat = r.pick(pool);
        const opts = KINDS[cat].filter((k) => k !== this.lastKind);
        kind = r.pick(opts.length ? opts : KINDS[cat]);
        this.badRun = 0;
      } else {
        const opts = BAD.filter((k) => k !== this.lastKind);
        kind = r.pick(opts);
        this.badRun++;
      }
      this.lastKind = kind;
      this.items.push({ kind, good, cat: good ? C.goodFood[kind].cat : null, x, y: ITEM_Y, bob: r() * 6, state: 'lane', t0: 0 });
    }

    mouth() {
      const j = A.ouJoints('eat');
      return { x: this.bakti.x + j.head.x * this.scale, y: this.bakti.y + (j.head.y + 13) * this.scale };
    }

    update(dt) {
      this.t += dt;
      const speed = this.cfg.speed + this.cfg.speedUp * Math.min(1, this.t / 22);
      for (const it of this.items) {
        if (it.state === 'lane') it.x -= speed * dt;
        else if (it.state === 'rejected') { it.x -= speed * 0.4 * dt; it.t0 += dt; }
      }
      this.items = this.items.filter((it) => it.x > -90 && !(it.state === 'rejected' && it.t0 > 1.1) && it.state !== 'gone');
      const lastX = this.items.reduce((m, it) => Math.max(m, it.state === 'lane' ? it.x : -1e9), -1e9);
      if (lastX < SPAWN_X - this.cfg.gap) this.spawn(Math.max(SPAWN_X, lastX + this.cfg.gap));
      for (const f of this.fly) {
        f.p += dt / 0.55;
        if (f.p >= 1 && !f.arrived) {
          f.arrived = true;
          this.got[f.cat]++;
          this.bakti.eatKind = f.kind; this.bakti.eatUntil = this.t + 1.1;
          S.Audio.munch();
        }
      }
      this.fly = this.fly.filter((f) => !f.arrived);
    }

    pointer(x, y, tol) {
      let best = null, bd = 1e9;
      for (const it of this.items) {
        if (it.state !== 'lane') continue;
        const d = S.dist(x, y, it.x, it.y);
        if (d < HIT_R + tol && d < bd) { best = it; bd = d; }
      }
      if (!best) return false;
      if (best.good) {
        const name = C.goodFood[best.kind].name;
        const pending = this.got[best.cat] + this.fly.filter((f) => f.cat === best.cat).length;
        best.state = 'gone';
        const m = this.mouth();
        this.fly.push({ kind: best.kind, cat: best.cat, sx: best.x, sy: best.y, ex: m.x, ey: m.y, p: 0 });
        if (pending >= this.need) {
          this.g.float(best.x, best.y - 40, C.feedFull, '#cfe8ff');
          this.g.good(2, best.x, best.y);
        } else this.g.good(CFG.goodPoints, best.x, best.y, name);
      } else {
        const b = C.badFood[best.kind];
        best.state = 'rejected'; best.t0 = 0;
        this.bakti.sadUntil = this.t + 1.2;
        this.g.bad(CFG.badPenalty, best.x, best.y - 30, b.name + '? Jangan!', b.text);
      }
      return true;
    }

    baktiPose() {
      const b = this.bakti;
      if (this.t < b.eatUntil) return { pose: 'eat', hold: b.eatKind };
      if (this.fly.length) return { pose: 'beg' };
      if (this.t < b.sadUntil) return { pose: 'surprise' };
      let look = 0, best = 1e9;
      for (const it of this.items) if (it.good && it.state === 'lane' && it.x > b.x && it.x - b.x < best) { best = it.x - b.x; look = S.clamp((it.x - b.x) / 700, 0, 1); }
      return { pose: Object.assign({}, A.OU_POSES.sit, { look, face: this.done ? 'happy' : 'neutral' }) };
    }

    render(ctx, now) {
      A.blit(ctx, this.bg);
      const p = this.baktiPose();
      const breathe = Math.sin(now * 2.2) * 1.5;
      A.drawOrangutan(ctx, this.bakti.x, this.bakti.y + breathe, this.scale, p.pose, { t: now, hold: p.hold, blinkSeed: 1.3 });
      // makanan di atas batang kayu
      for (const it of this.items) {
        if (it.state === 'gone') continue;
        let x = it.x, y = it.y + Math.sin(now * 2 + it.bob) * 3, a = 1;
        if (it.state === 'rejected') { x += Math.sin(it.t0 * 40) * 6 * (1 - it.t0); y += it.t0 * it.t0 * 60; a = Math.max(0, 1 - it.t0); }
        ctx.save(); ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(30,50,20,.28)';
        ctx.beginPath(); ctx.ellipse(x, ITEM_Y + 46, 46, 8, 0, 0, S.TAU); ctx.fill();
        A.drawLeaf(ctx, x - 56, ITEM_Y + 40, 112, 0, '#6fae4a', '#3c6f2b', 0.18);
        A.drawFood(ctx, it.kind, x, y, 46, now);
        if (it.state === 'rejected') A.mark(ctx, x + 30, y - 32, false, 1.2);
        ctx.restore();
      }
      for (const f of this.fly) {
        const k = S.ease.inOut(Math.min(1, f.p));
        const x = S.lerp(f.sx, f.ex, k), y = S.lerp(f.sy, f.ey, k) - Math.sin(k * Math.PI) * 160;
        A.drawFood(ctx, f.kind, x, y, 46 - 26 * k, now);
      }
      this.renderMenu(ctx, now);
    }

    renderMenu(ctx, now) {
      const x = 1110, y = 192, w = 464, h = 178;
      A.panel(ctx, x, y, w, h, 'Menu sehat Bakti');
      CATS.forEach((c, i) => {
        const cx = x + 64 + i * 112, cy = y + 78;
        const full = this.got[c] >= this.need;
        if (full) { ctx.fillStyle = 'rgba(126,217,87,.22)'; ctx.beginPath(); ctx.arc(cx, cy, 36, 0, S.TAU); ctx.fill(); }
        A.drawFood(ctx, CAT_ICON[c], cx, cy, 28, now);
        A.text(ctx, C.foodCats[c], cx, cy + 46, 13, full ? '#bff0a0' : '#e8efe0', 'center', 800);
        for (let k = 0; k < this.need; k++) {
          const dx = cx + (k - (this.need - 1) / 2) * 24, dy = cy + 70;
          ctx.beginPath(); ctx.arc(dx, dy, 8, 0, S.TAU);
          if (k < this.got[c]) { ctx.fillStyle = '#ffd25e'; ctx.fill(); }
          else { ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]); }
        }
        if (full) A.mark(ctx, cx + 28, cy - 26, true, 0.6);
      });
    }
  }
  L.feed = Feed;
})();

</script>

/* Pelajaran 2 · Memanjat: pilih dahan yang kuat untuk naik ke kanopi, hindari dahan lapuk. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG;
  const L = (S.Lessons = S.Lessons || {});
  const TRUNK_X = 800, TRUNK_W = 132, GROUND = 862, GRIP_SCREEN_Y = 440, PAR = 0.45;

  class Climb {
    constructor(g, o) {
      this.g = g; this.def = o.def; this.rng = S.rng(o.seed); this.t = 0;
      this.steps = CFG.climb.steps; this.gap = CFG.climb.gap;
      this.scale = 1.05 * o.s;
      const r = this.rng;
      this.levels = [];
      for (let i = 0; i < this.steps; i++) {
        const y0 = GROUND - 200 - i * this.gap, rottenSide = r.chance(0.5) ? -1 : 1, subtle = i >= CFG.climb.subtleFrom;
        const options = [-1, 1].map((side) => {
          const rotten = side === rottenSide;
          const g2 = A.branchGeom(TRUNK_X + side * TRUNK_W * 0.4, y0 + r.range(-12, 12), r.range(250, 300), side, r.range(10, 26));
          return { side, g: g2, rotten, broken: false, fallT: 0, seed: r.seed(), subtle, leafy: subtle ? 0.2 + r() * 0.35 : 1, dry: !subtle && r.chance(0.6) };
        });
        this.levels.push({ y0, options });
      }
      this.topY = this.levels[this.steps - 1].y0 - 300;
      this.cur = -1; this.curOpt = null;
      this.pos = { x: TRUNK_X - 150, y: GROUND - 26 * this.scale };
      this.anim = null; this.camY = 0; this.flinchUntil = -1; this.reached = false;
      this.par = this.buildParallax();
      this.lianas = [];
      for (let i = 0; i < 7; i++) this.lianas.push({ x: r.range(120, 1480), y: r.range(this.topY, GROUND - 300), len: r.range(220, 420), ph: r() * 6 });
    }
    objective() { const n = this.cur + 1; return { text: S.tpl(this.def.objective, { n, m: this.steps }), frac: n / this.steps }; }
    get done() { return this.reached && !this.anim; }

    buildParallax() {
      const R = S.R * 0.6, H = Math.ceil(900 + (GROUND - this.topY) * PAR + 100);
      this.parH = H;
      const c = S.makeCanvas(S.VW * R, H * R), ctx = c.getContext('2d');
      ctx.scale(R, R);
      const rnd = S.rng(77);
      for (let i = 0; i < 9; i++) {
        const x = 60 + i * 185 + rnd() * 60, w = 30 + rnd() * 40;
        if (Math.abs(x - TRUNK_X) < 160) continue;
        ctx.fillStyle = 'rgba(60,96,74,.55)'; ctx.fillRect(x - w / 2, 0, w, H);
      }
      for (let y = 80; y < H; y += 260) {
        for (let k = 0; k < 3; k++) {
          const x = rnd() * S.VW;
          ctx.globalAlpha = 0.5;
          A.drawFoliage(ctx, x, y + rnd() * 120, 110 + rnd() * 60, rnd.seed(), ['#3b6f52', '#4b8160', '#5c916b', '#77a679']);
        }
      }
      ctx.globalAlpha = 1;
      return c;
    }

    gripOf(opt) {
      const g = opt.g, k = 0.6;
      return { x: g.x0 + (g.x1 - g.x0) * k, y: g.y0 + (g.y1 - g.y0) * k };
    }
    hipFor(opt) {
      const gp = this.gripOf(opt), off = A.ouGrip('hang', this.scale);
      return { x: gp.x - off.x, y: gp.y - off.y + 4 };
    }

    update(dt) {
      this.t += dt;
      if (this.anim) {
        this.anim.p += dt / this.anim.dur;
        if (this.anim.p >= 1) { this.pos = this.anim.to; this.anim = null; }
      }
      for (const lv of this.levels) for (const o of lv.options) if (o.broken) o.fallT += dt;
      const target = this.curOpt ? Math.min(0, this.gripOf(this.curOpt).y - GRIP_SCREEN_Y) : 0;
      this.camY = S.approach(this.camY, target, 4, dt);
    }

    pointer(x, y, tol) {
      if (this.anim || this.reached) return true;
      const wy = y + this.camY, next = this.levels[this.cur + 1];
      if (!next) return false;
      let best = null, bd = 1e9;
      for (const o of next.options) {
        if (o.broken) continue;
        const g = o.g, d = Math.min(S.segDist(x, wy, g.x0, g.y0, g.x1, g.y1), S.dist(x, wy, g.x1, g.y1) - 25);
        if (d < 40 + tol && d < bd) { best = o; bd = d; }
      }
      if (!best) return false;
      if (best.rotten) {
        best.broken = true; best.fallT = 0;
        this.flinchUntil = this.t + 0.9;
        S.Audio.crack();
        this.g.bad(CFG.badPenalty, x, y, C.rotten.title, C.rotten.text);
      } else {
        const to = this.hipFor(best);
        this.anim = { from: { x: this.pos.x, y: this.pos.y }, to, p: 0, dur: 0.62, flip: to.x < this.pos.x };
        this.cur++; this.curOpt = best;
        if (this.cur >= this.steps - 1) this.reached = true;
        S.Audio.whoosh();
        this.g.good(CFG.goodPoints, x, y, C.climbGood);
      }
      return true;
    }

    renderBg(ctx) {
      const h = S.clamp(-this.camY / (GROUND - this.topY - 600), 0, 1);
      const g = ctx.createLinearGradient(0, 0, 0, S.VH);
      g.addColorStop(0, S.mixColor('#4f8a6c', '#bfe7e0', h));
      g.addColorStop(1, S.mixColor('#21462f', '#7fb79a', h));
      ctx.fillStyle = g; ctx.fillRect(0, 0, S.VW, S.VH);
      ctx.drawImage(this.par, 0, S.VH - this.parH - this.camY * PAR, S.VW, this.parH);
    }

    render(ctx, now) {
      this.renderBg(ctx);
      ctx.save(); ctx.translate(0, -this.camY);
      const viewTop = this.camY - 60, viewBot = this.camY + S.VH + 60;
      for (const l of this.lianas) {
        if (l.y > viewBot || l.y + l.len < viewTop) continue;
        const sw = Math.sin(now * 0.8 + l.ph) * 12;
        A.drawLiana(ctx, l.x, l.y, l.x + sw, l.y + l.len, 0, 5, 'rgba(70,95,45,.85)');
      }
      // tajuk di puncak
      A.drawFoliage(ctx, TRUNK_X - 260, this.topY + 120, 210, 81);
      A.drawFoliage(ctx, TRUNK_X + 280, this.topY + 90, 230, 82);
      A.drawTrunk(ctx, TRUNK_X, this.topY + 60, GROUND + 10, TRUNK_W, { buttress: true, seed: 21 });
      A.drawFoliage(ctx, TRUNK_X, this.topY + 40, 260, 83);
      for (let i = 0; i < 5; i++) A.drawFood(ctx, 'ara', TRUNK_X - 160 + i * 80, this.topY + 170 + (i % 2) * 30, 22, now);
      // tanah
      ctx.fillStyle = '#2f5a2a'; ctx.fillRect(-10, GROUND - 4, S.VW + 20, 200);
      A.fern(ctx, 300, GROUND, 1.2, '#3f7a35'); A.fern(ctx, 1320, GROUND, 1.1, '#3f7a35', true);
      A.grass(ctx, 0, S.VW, GROUND + 2, 30, '#4f8a35', 5);
      // dahan
      this.levels.forEach((lv, i) => {
        if (lv.y0 > viewBot + 200 || lv.y0 < viewTop - 200) return;
        for (const o of lv.options) {
          const opts = { rotten: o.rotten, seed: o.seed, subtle: o.subtle, leafy: o.leafy, dryLeaves: o.dry, w: 34 };
          if (o.broken) {
            if (o.fallT > 1.4) continue;
            opts.drop = o.fallT * 1.6; opts.dropY = o.fallT * o.fallT * 520; opts.alpha = Math.max(0, 1 - o.fallT / 1.4);
          }
          A.drawBranch(ctx, o.g, opts);
          if (i === this.cur + 1 && !o.broken && !this.anim) {
            const p = 0.5 + 0.5 * Math.sin(now * 4 + o.side);
            ctx.fillStyle = `rgba(255,246,190,${0.35 + p * 0.4})`;
            ctx.beginPath(); ctx.arc(o.g.x1, o.g.y1, 9 + p * 4, 0, S.TAU); ctx.fill();
          }
        }
      });
      this.renderBakti(ctx, now);
      ctx.restore();
      this.renderMeter(ctx, now);
    }

    renderBakti(ctx, now) {
      let x = this.pos.x, y = this.pos.y, pose, flip = false;
      if (this.anim) {
        const k = S.ease.inOut(Math.min(1, this.anim.p));
        x = S.lerp(this.anim.from.x, this.anim.to.x, k);
        y = S.lerp(this.anim.from.y, this.anim.to.y, k) - Math.sin(k * Math.PI) * 50;
        pose = k < 0.55 ? 'reach' : 'hang'; flip = this.anim.flip;
      } else if (this.cur < 0) {
        pose = Object.assign({}, A.OU_POSES.sit, { look: 0.4, face: 'neutral' });
      } else {
        const sw = Math.sin(now * 1.8) * 4;
        pose = Object.assign({}, A.OU_POSES.hang, { body: sw, face: this.reached ? 'happy' : 'neutral' });
        if (this.t < this.flinchUntil) pose.face = 'surprise';
      }
      if (this.cur < 0 && this.t < this.flinchUntil) pose = 'surprise';
      A.drawOrangutan(ctx, x, y, this.scale, pose, { t: now, flip, blinkSeed: 2.1 });
    }

    renderMeter(ctx, now) {
      const x = 64, y0 = 780, y1 = 230;
      A.panel(ctx, x - 34, y1 - 48, 68, y0 - y1 + 96);
      ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
      const n = this.cur + 1, k = n / this.steps;
      ctx.strokeStyle = '#ffd25e';
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y0 - (y0 - y1) * k); ctx.stroke();
      for (let i = 1; i <= this.steps; i++) {
        const yy = y0 - (y0 - y1) * (i / this.steps);
        ctx.fillStyle = i <= n ? '#ffd25e' : 'rgba(255,255,255,.45)';
        ctx.beginPath(); ctx.arc(x, yy, 5, 0, S.TAU); ctx.fill();
      }
      A.drawFoliage(ctx, x, y1 - 22, 22, 9, ['#2e6b3a', '#5aa64c', '#8cc65a'], { n: 6 });
      A.drawOrangutan(ctx, x, y0 - (y0 - y1) * k + 14, 0.26, 'hang', { t: now });
    }
  }
  L.climb = Climb;
})();

</script>
  <script>/* js/lessons/forage.js */
/* Pelajaran 3 · Mencari makan: temukan makanan tersembunyi di kanopi, pilih alat yang tepat,
   dan cari daun lebar sebagai payung saat hujan. */
(function () {
  'use strict';
  const S = window.SHB, A = S.Art, C = window.SHB_CONTENT, CFG = window.SHB_CONFIG, UI = S.UI;
  const L = (S.Lessons = S.Lessons || {});
  const BRANCH = { x0: 200, y0: 700, x1: 1410, y1: 668 };
  const branchY = (x) => BRANCH.y0 + (BRANCH.y1 - BRANCH.y0) * ((x - BRANCH.x0) / (BRANCH.x1 - BRANCH.x0));
  const TARGETS = [
    { id: 'ara', type: 'food', x: 470, y: 300, food: 'ara', r: 40 },
    { id: 'rambutan', type: 'food', x: 1190, y: 296, food: 'rambutan', r: 38 },
    { id: 'daun', type: 'food', x: 830, y: 168, food: 'daun', r: 38 },
    { id: 'durian', type: 'food', x: 1010, y: 478, food: 'durian', r: 36 },
    { id: 'rayap', type: 'tool', x: 236, y: 486, food: 'rayap' },
    { id: 'air', type: 'tool', x: 1384, y: 470, food: 'leafSponge' }
  ];
  const RAIN_LEAVES = [{ x: 470, y: 772, a: -2.2 }, { x: 1180, y: 778, a: -0.9 }];

  function drawBack(ctx, w, h) {
    A.bgCanopyBack(ctx, w, h);
    A.drawFoliage(ctx, 300, 70, 170, 101);
    A.drawFoliage(ctx, 1450, 90, 170, 102);
    A.drawFoliage(ctx, 800, 70, 210, 103);
    A.drawTrunk(ctx, 210, -20, h + 20, 150, { seed: 31 });
    A.drawTrunk(ctx, 1400, -20, h + 20, 124, { seed: 32 });
    A.drawBranch(ctx, A.branchGeom(270, 420, 380, 1, 190), { seed: 33, w: 34, leafy: 0.8 });
    A.drawBranch(ctx, A.branchGeom(1350, 400, 360, -1, 170), { seed: 34, w: 30, leafy: 0.8 });
    A.drawBranch(ctx, A.branchGeom(1345, 440, 380, -1, 10), { seed: 35, w: 26, leafy: 0.5 });
    A.drawFoliage(ctx, 480, 250, 150, 104);
    A.drawFoliage(ctx, 1160, 240, 150, 105);
    A.drawLiana(ctx, 620, -10, 980, -10, 340, 6);
    A.drawLiana(ctx, 330, 120, 520, 0, 260, 5);
    // tanaman berdaun lebar di bawah dahan
    for (const p of RAIN_LEAVES) {
      ctx.strokeStyle = '#3b5a1e'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(p.x, h + 10); ctx.quadraticCurveTo(p.x - 20, p.y + 60, p.x, p.y + 10); ctx.stroke();
    }
    A.fern(ctx, 120, h, 1, '#2f6a32'); A.fern(ctx, 1520, h, 1, '#2f6a32', true);
    // dahan utama tempat Bakti duduk
    A.drawBranch(ctx, BRANCH, { seed: 36, w: 66, leafy: 0.5 });
  }
  function drawFront(ctx) {
    A.drawFoliage(ctx, 548, 350, 84, 111, ['#2a6136', '#3b8040', '#55a048', '#86c25a']);
    A.drawFoliage(ctx, 1112, 350, 80, 112, ['#2a6136', '#3b8040', '#55a048', '#86c25a']);
    A.drawFoliage(ctx, 904, 196, 76, 113, ['#2a6136', '#3b8040', '#55a048', '#86c25a']);
    A.drawFoliage(ctx, 1064, 520, 54, 114, ['#2a6136', '#3b8040', '#55a048', '#86c25a']);
    A.drawFoliage(ctx, 0, 0, 150, 115, ['#1f4f2c', '#2e6b3a', '#3f8a45']);
    A.drawFoliage(ctx, 1600, 0, 150, 116, ['#1f4f2c', '#2e6b3a', '#3f8a45']);
  }

  class Forage {
    constructor(g, o) {
      this.g = g; this.def = o.def; this.rng = S.rng(o.seed); this.t = 0;
      this.scale = 1.32 * o.s;
      this.bx = 800; this.by = branchY(800) - 30 - 24 * this.scale;
      this.found = new Set(); this.anims = []; this.lastFind = 0;
      this.rain = { started: false, start: 0, umbrella: false, end: 0, missed: false, over: false };
      this.eatUntil = -1; this.eatKind = null;
      this.back = A.layer('forage-back', drawBack);
      this.front = A.layer('forage-front', (ctx) => drawFront(ctx));
      this.drops = [];
      for (let i = 0; i < 140; i++) this.drops.push({ x: this.rng() * 1700, y: this.rng() * 900, v: 900 + this.rng() * 500 });
    }
    get total() { return TARGETS.length + (this.rain.missed ? 0 : 1); }
    count() { return this.found.size + (this.rain.umbrella ? 1 : 0); }
    objective() { return { text: S.tpl(this.def.objective, { n: this.count(), m: this.total }), frac: this.count() / this.total }; }
    get done() { return this.found.size >= TARGETS.length && this.rain.over && this.anims.length === 0; }

    update(dt) {
      this.t += dt;
      const fc = CFG.forage, r = this.rain;
      if (!r.started && (this.t >= fc.rainAt || this.found.size >= TARGETS.length)) {
        r.started = true; r.start = this.t;
        UI.banner(C.rain.start, C.rain.hint, '');
        S.Audio.rain(true);
      }
      if (r.started && !r.over) {
        if (r.umbrella && this.t > r.end) { r.over = true; S.Audio.rain(false); }
        else if (!r.umbrella && this.t - r.start > fc.rainMax) { r.over = true; r.missed = true; this.g.slip(); S.Audio.rain(false); }
      }
      for (const a of this.anims) {
        a.p += dt / a.dur;
        if (a.p >= 1 && !a.doneCb) { a.doneCb = true; if (a.after) a.after(); }
      }
      this.anims = this.anims.filter((a) => a.p < 1);
      const raining = r.started && !r.over;
      for (const d of this.drops) { d.y += d.v * dt; d.x -= d.v * 0.18 * dt; if (d.y > 920) { d.y = -20; d.x = this.rng() * 1700; } }
      this.raining = raining;
    }

    mouth() { const j = A.ouJoints('eat'); return { x: this.bx + j.head.x * this.scale, y: this.by + (j.head.y + 13) * this.scale }; }
    feed(kind, sx, sy) {
      const m = this.mouth();
      this.anims.push({ type: 'fly', kind, sx, sy, ex: m.x, ey: m.y, p: 0, dur: 0.6, after: () => { this.eatKind = kind; this.eatUntil = this.t + 1.2; S.Audio.munch(); } });
    }

    pointer(x, y, tol) {
      const r = this.rain;
      if (r.started && !r.over && !r.umbrella) {
        for (const p of RAIN_LEAVES) {
          if (S.dist(x, y, p.x + Math.cos(p.a) * 40, p.y + Math.sin(p.a) * 40) < 75 + tol) {
            r.umbrella = true; r.end = this.t + 3.5; this.lastFind = this.t;
            S.Audio.rustle();
            this.g.good(CFG.goodPoints, x, y, C.rain.got);
            UI.bubble(x, y, C.rain.got, C.rain.text, true);
            return true;
          }
        }
      }
      for (const tg of TARGETS) {
        if (this.found.has(tg.id)) continue;
        const rad = tg.type === 'tool' ? 52 : tg.r + 22;
        if (S.dist(x, y, tg.x, tg.y) > rad + tol) continue;
        if (tg.type === 'food') {
          this.found.add(tg.id); this.lastFind = this.t;
          this.g.good(CFG.goodPoints, tg.x, tg.y, C.forageItems[tg.id]);
          this.feed(tg.food, tg.x, tg.y);
        } else this.askTool(tg);
        return true;
      }
      return false;
    }

    askTool(tg) {
      const task = C.toolTasks[tg.id];
      this.g.setPaused(true);
      let solved = false;
      UI.showTool(task, this.g.icons, (k, btn) => {
        if (solved || this.destroyed) return;
        if (k === task.answer) {
          solved = true;
          UI.toolFeedback(btn, true, task.right);
          this.found.add(tg.id); this.lastFind = this.t;
          this.g.good(CFG.goodPoints, tg.x, tg.y, task.label);
          setTimeout(() => {
            if (this.destroyed) return;
            UI.hideTool(); this.g.setPaused(false);
            this.anims.push({ type: 'tool', tool: k, x: tg.x, y: tg.y, side: tg.x < 800 ? 1 : -1, p: 0, dur: 1.2, after: () => this.feed(tg.food, tg.x, tg.y) });
          }, 1500);
        } else {
          UI.toolFeedback(btn, false, task.wrong[k]);
          this.g.bad(CFG.badPenalty, tg.x, tg.y);
        }
      });
    }

    destroy() { this.destroyed = true; UI.hideTool(); S.Audio.rain(false); }

    render(ctx, now) {
      A.blit(ctx, this.back);
      A.drawHollow(ctx, 236, 486, 1.25, 'rayap', now);
      A.drawHollow(ctx, 1384, 470, 1.2, 'air', now);
      for (const tg of TARGETS) {
        if (tg.type !== 'food' || this.found.has(tg.id)) continue;
        if (tg.id === 'durian') { ctx.strokeStyle = '#4a2e18'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(tg.x, tg.y - 60); ctx.lineTo(tg.x, tg.y - 30); ctx.stroke(); }
        A.drawFood(ctx, tg.food, tg.x, tg.y + Math.sin(now * 1.5 + tg.x) * 2, tg.r, now);
      }
      this.renderBakti(ctx, now);
      const r = this.rain;
      if (r.started && !r.over && !r.umbrella) {
        const grow = S.clamp((this.t - r.start) / 0.6, 0, 1);
        for (const p of RAIN_LEAVES) {
          A.drawBigLeaf(ctx, p.x, p.y + 10, 1.25 * S.ease.outBack(grow), p.a, false);
          if (this.t - r.start > 2.5) A.glow(ctx, p.x + Math.cos(p.a) * 55, p.y + Math.sin(p.a) * 55, 70, now);
        }
      } else {
        for (const p of RAIN_LEAVES) A.drawBigLeaf(ctx, p.x, p.y + 10, 0.55, p.a, false);
      }
      A.blit(ctx, this.front);
      for (const a of this.anims) this.renderAnim(ctx, a, now);
      if (this.raining) this.renderRain(ctx);
      if (!this.raining && this.t - this.lastFind > CFG.forage.hintAfter) {
        const tg = TARGETS.find((x) => !this.found.has(x.id));
        if (tg) { A.glow(ctx, tg.x, tg.y, 58, now); A.sparkle(ctx, tg.x + 30, tg.y - 30, 1.2, now); }
      }
    }

    renderBakti(ctx, now) {
      let pose, hold = null;
      const umbrellaOn = this.rain.umbrella && !this.rain.over;
      if (umbrellaOn) { pose = 'umbrella'; hold = 'umbrella'; }
      else if (this.t < this.eatUntil) { pose = 'eat'; hold = this.eatKind; }
      else if (this.raining) pose = Object.assign({}, A.OU_POSES.sad, { look: 0 });
      else {
        const tg = TARGETS.find((x) => !this.found.has(x.id));
        const look = tg ? S.clamp((tg.x - this.bx) / 500, -1, 1) : 0;
        pose = Object.assign({}, A.OU_POSES.sit, { look, face: 'neutral', head: tg && tg.y < 400 ? -4 : 0 });
      }
      A.drawOrangutan(ctx, this.bx, this.by + Math.sin(now * 2) * 1.2, this.scale, pose, { t: now, hold, blinkSeed: 0.6 });
    }

    renderAnim(ctx, a, now) {
      const k = Math.min(1, a.p);
      if (a.type === 'fly') {
        const e = S.ease.inOut(k);
        const x = S.lerp(a.sx, a.ex, e), y = S.lerp(a.sy, a.ey, e) - Math.sin(e * Math.PI) * 90;
        if (a.kind === 'leafSponge') {
          ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#5f9a3c'; ctx.strokeStyle = '#26431b'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(0, 0, 22 - 8 * e, 15 - 5 * e, 0.4, 0, S.TAU); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#9fd8ff'; ctx.beginPath(); ctx.arc(6, 10, 4, 0, S.TAU); ctx.fill(); ctx.restore();
        } else A.drawFood(ctx, a.kind, x, y, 36 - 18 * e, now);
      } else if (a.type === 'tool') {
        const poke = Math.sin(k * Math.PI * 4) * 16;
        ctx.save(); ctx.translate(a.x + a.side * (60 - poke), a.y + 10);
        ctx.scale(a.side, 1);
        if (a.tool === 'ranting') { ctx.rotate(-0.15); A.drawFood(ctx, 'ranting', -10, 0, 40, now); }
        else { ctx.fillStyle = '#5f9a3c'; ctx.strokeStyle = '#26431b'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(-18, 0, 26, 16, 0.3, 0, S.TAU); ctx.fill(); ctx.stroke(); }
        ctx.restore();
        A.sparkle(ctx, a.x, a.y - 40, 1, now);
      }
    }

    renderRain(ctx) {
      ctx.save();
      ctx.fillStyle = 'rgba(30,50,70,.22)'; ctx.fillRect(0, 0, S.VW, S.VH);
      ctx.strokeStyle = 'rgba(210,235,255,.55)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (const d of this.drops) { ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 7, d.y + 34); }
      ctx.stroke();
      ctx.restore();
    }
  }
  L.forage = Forage;
})();
