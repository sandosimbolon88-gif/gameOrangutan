<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d2a24">
  <meta name="description" content="Sekolah Hutan Bakti — game edukasi tentang rehabilitasi orang utan.">
  <title>Sekolah Hutan Bakti</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" aria-label="Hutan tempat Bakti belajar"></canvas>

      <!-- HUD -->
      <div id="hud" class="hidden" aria-live="polite">
        <div class="hud-top">
          <div class="pill hud-score"><span class="lbl" data-t="ui.score"></span><span id="hud-score" class="val">0</span></div>
          <div class="pill hud-mid">
            <div class="hud-lesson"><span id="hud-lesson-n"></span> · <b id="hud-lesson-title"></b></div>
            <div class="hud-objective" id="hud-objective"></div>
            <div class="hud-progress"><span id="hud-progress"></span></div>
          </div>
          <div class="pill hud-time"><span class="lbl" data-t="ui.time"></span><span id="hud-time" class="val">0:00</span>
            <div class="bar"><span id="hud-timebar"></span></div></div>
        </div>
      </div>
      <button type="button" id="btn-play-menu" class="btn btn-small play-menu hidden" data-t="ui.playMenu" title="Menu utama (Esc)" aria-keyshortcuts="Escape"></button>

      <div id="banner" class="banner"></div>
      <div id="bubbles"></div>

      <!-- Godaan di ujian pulau -->
      <div id="tempt" class="tempt hidden">
        <div class="tempt-prompt" id="tempt-prompt"></div>
        <button type="button" class="btn tempt-btn" id="tempt-btn"><img id="tempt-icon" alt=""><span id="tempt-label"></span></button>
        <div class="tempt-ring"><span id="tempt-ring"></span></div>
      </div>
      <button type="button" id="btn-skip-cutscene" class="btn btn-small skip-cutscene hidden" data-t="ui.skipCutscene"></button>

      <!-- Layar awal -->
      <section id="screen-attract" class="screen">
        <div class="attract-shade"></div>
        <div class="attract-main">
          <div class="brand-line"><span class="brand-word">bakti<span>BCA</span></span><span class="edition" id="attract-edition"></span></div>
          <h1 class="game-title" id="attract-title"></h1>
          <p class="tagline" data-t="tagline"></p>
          <button class="btn btn-primary btn-big" id="btn-start" data-t="ui.start"></button>
          <div class="hint-touch" data-t="hintTouch"></div>
          <div class="mission-meta"><span>◷ <b id="session-length"></b></span><span>✦ <b id="session-lessons"></b></span></div>
        </div>
        <div class="habitat-label"><span id="habitat-kicker"></span><b id="habitat-name"></b></div>
        <div class="attract-side">
          <div class="card fact-card-mini">
            <div class="card-kicker" data-t="ui.didYouKnow"></div>
            <h3 id="attract-fact-title"></h3>
            <p id="attract-fact-text"></p>
          </div>
          <div class="card dark mini-board">
            <div class="card-kicker" data-t="ui.topToday"></div>
            <ol id="attract-top" class="mini-list"></ol>
          </div>
        </div>
        <div class="attract-tools">
          <button class="btn btn-small" id="btn-program" data-t="ui.programButton"></button>
          <button class="btn btn-small" id="btn-board" data-t="ui.boardButton"></button>
          <button class="btn btn-small btn-icon" id="btn-fullscreen" aria-label="Layar penuh" title="Layar penuh">
            <svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="currentColor" d="M4 9V4h5v2H6v3H4zm10-5h6v5h-2V6h-4V4zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-6v-2h4z"/></svg>
          </button>
        </div>
        <div id="admin-hotspot" aria-hidden="true"></div>
      </section>

      <!-- Briefing -->
      <section id="screen-briefing" class="screen dim">
        <div class="panel brief-panel">
          <div class="card-kicker" data-t="ui.briefKicker"></div>
          <h2 data-t="ui.briefTitle"></h2>
          <p class="lead" data-t="ui.briefText"></p>
          <ol class="roadmap" id="roadmap"></ol>
          <p class="competition-note" data-t="ui.briefNote"></p>
          <button class="btn btn-primary btn-big" id="btn-go" data-t="ui.go"></button>
        </div>
      </section>

      <!-- Cara main tiap pelajaran -->
      <section id="overlay-intro" class="screen dim">
        <div class="panel intro-panel">
          <div class="badge" id="intro-n"></div>
          <div class="card-kicker" id="intro-stage"></div>
          <h2 id="intro-title"></h2>
          <div class="how" id="intro-how"></div>
          <div class="intro-time" id="intro-time"></div>
          <button class="btn btn-primary btn-big" id="btn-intro-go" data-t="ui.ready"></button>
          <div class="auto-bar"><span id="intro-auto"></span></div>
        </div>
      </section>

      <!-- Rapor tiap pelajaran -->
      <section id="overlay-report" class="screen dim">
        <div class="panel report-panel">
          <div class="badge" id="report-badge"></div>
          <div class="report-stars" id="report-stars"></div>
          <div class="report-points"><span data-t="ui.lessonPoints"></span><b id="report-points">0</b><small id="report-bonus"></small></div>
          <div class="report-fact">
            <div class="card-kicker" data-t="ui.didYouKnow"></div>
            <h3 id="report-fact-title"></h3>
            <p id="report-fact-text"></p>
          </div>
          <button class="btn btn-primary" id="btn-report-next"></button>
        </div>
      </section>

      <!-- Pilih alat -->
      <section id="overlay-tool" class="screen dim soft">
        <div class="panel tool-panel">
          <div class="card-kicker" data-t="toolKicker"></div>
          <h3 id="tool-prompt"></h3>
          <div class="tool-options" id="tool-options"></div>
          <p class="tool-msg" id="tool-msg"></p>
        </div>
      </section>

      <!-- Hasil + input nama -->
      <section id="screen-result" class="screen dim">
        <div class="result-wrap">
          <div class="panel result-panel">
            <div class="card-kicker" data-t="ui.resultKicker"></div>
            <h2 id="result-title"></h2>
            <div class="score-big"><span id="result-score">0</span><small data-t="ui.resultUnit"></small></div>
            <ol class="rapor" id="result-rapor"></ol>
            <div class="stats">
              <div><b id="result-stars">0</b><span data-t="ui.stars"></span></div>
              <div><b id="result-mistakes">0</b><span data-t="ui.mistakes"></span></div>
              <div><b id="result-rank">-</b><span data-t="ui.rankToday"></span></div>
            </div>
            <div class="action">
              <div class="card-kicker" data-t="ui.actionKicker"></div>
              <p id="result-action"></p>
            </div>
          </div>
          <div class="panel name-panel">
            <h3 data-t="ui.namePrompt"></h3>
            <div class="name-display" id="name-display"><span id="name-text"></span><i class="caret"></i></div>
            <div class="keyboard" id="keyboard"></div>
            <div class="row">
              <button class="btn" id="btn-skip" data-t="ui.skip"></button>
              <button class="btn btn-primary" id="btn-save" data-t="ui.save"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- Papan skor -->
      <section id="screen-board" class="screen dim">
        <div class="panel board-panel">
          <h2 data-t="ui.boardTitle"></h2>
          <div class="boards">
            <div class="board"><h3 data-t="ui.today"></h3><ol id="board-today" class="board-list"></ol></div>
            <div class="board"><h3 data-t="ui.allTime"></h3><ol id="board-all" class="board-list"></ol></div>
          </div>
          <div class="row">
            <button class="btn" id="btn-home" data-t="ui.home"></button>
            <button class="btn btn-primary" id="btn-again" data-t="ui.again"></button>
          </div>
        </div>
      </section>

      <!-- Kenali program -->
      <section id="overlay-program" class="screen dim" role="dialog" aria-modal="true" aria-labelledby="program-title">
        <div class="panel program-panel">
          <div class="card-kicker" data-t="program.kicker"></div>
          <h2 id="program-title" data-t="program.title"></h2>
          <p class="lead" data-t="program.lead"></p>
          <p class="program-count" id="program-count"></p>
          <div class="program-grid" id="program-grid"></div>
          <p class="source-note" data-t="program.source"></p>
          <div class="row"><button class="btn" id="btn-program-source" data-t="program.sourceButton"></button><button class="btn btn-primary" id="btn-program-close" data-t="program.close"></button></div>
        </div>
      </section>

      <!-- Admin -->
      <section id="overlay-admin" class="screen dim">
        <div class="panel admin-panel">
          <div id="admin-pin">
            <h3 data-t="ui.adminPin"></h3>
            <div class="pin-display" id="pin-display"></div>
            <div class="pinpad" id="pinpad"></div>
            <div class="row"><button class="btn" id="btn-admin-cancel" data-t="ui.adminClose"></button></div>
          </div>
          <div id="admin-menu" class="hidden">
            <h2 data-t="ui.adminTitle"></h2>
            <div class="admin-row"><span data-t="ui.adminDuration"></span><div id="admin-durations" class="seg"></div></div>
            <div class="admin-row"><span data-t="ui.adminSound"></span><div id="admin-sound" class="seg"></div></div>
            <div class="admin-actions">
              <button class="btn" id="btn-admin-export" data-t="ui.adminExport"></button>
              <div class="admin-pair">
                <button class="btn" id="btn-admin-backup" data-t="ui.adminBackup"></button>
                <button class="btn" id="btn-admin-import" data-t="ui.adminImport"></button>
              </div>
              <input type="file" id="admin-import-file" accept=".json,application/json" hidden>
              <div class="admin-msg" id="admin-msg"></div>
              <button class="btn btn-danger" id="btn-admin-reset-today" data-t="ui.adminResetToday"></button>
              <button class="btn btn-danger" id="btn-admin-reset-all" data-t="ui.adminResetAll"></button>
            </div>
            <div class="row"><button class="btn btn-primary" id="btn-admin-close" data-t="ui.adminDone"></button></div>
          </div>
        </div>
      </section>

      <button id="btn-mute" class="btn btn-small btn-icon mute" aria-label="Suara" title="Suara">
        <svg class="on" viewBox="0 0 24 24" width="1em" height="1em"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="off" viewBox="0 0 24 24" width="1em" height="1em"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
      </button>
      <div id="loading" class="loading">Menyiapkan hutan…</div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/content.js"></script>
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art/orangutan.js"></script>
  <script src="js/art/props.js"></script>
  <script src="js/art/scenery.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/lessons/feed.js"></script>
  <script src="js/lessons/climb.js"></script>
  <script src="js/lessons/forage.js"></script>
  <script src="js/lessons/nest.js"></script>
  <script src="js/lessons/island.js"></script>
  <script src="js/lessons/release.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
